<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .main-title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 22px; fill: #45d1b3; letter-spacing: 2px; }
      .layer-title { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .box-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; font-weight: 600; fill: #E7E5D9; }
      .box-desc { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; font-weight: 400; fill: #8A8276; }
      .flow-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 12px; font-weight: 400; fill: rgba(138,130,118,0.8); }
      .flow-label-accent { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 12px; font-weight: 600; fill: #45d1b3; }
      .annotation { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; font-weight: 600; fill: rgba(138,130,118,0.7); letter-spacing: 3px; }
      .step-num { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #C85A3A; }
      .agent-name { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#F5F3EA" />

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" class="main-title">APP COMMUNICATION FLOW</text>
  <text x="700" y="67" text-anchor="middle" class="annotation">HOW THE AGENTS THINK AND THE GEOMETRY UPDATES</text>

  <!-- =========================================== -->
  <!-- TOP ROW: GEMINI API (Cloud) -->
  <!-- =========================================== -->
  <rect x="350" y="100" width="700" height="130" rx="8" fill="#413C36" stroke="#45d1b3" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="700" y="125" text-anchor="middle" class="layer-title" fill="#45d1b3">GEMINI API (CLOUD)</text>
  <text x="700" y="148" text-anchor="middle" class="box-desc" fill="#E7E5D9">gemini-3-flash — powers all agent reasoning</text>

  <!-- Agent icons inside Gemini box -->
  <rect x="390" y="165" width="80" height="35" rx="4" fill="rgba(69,209,179,0.08)" stroke="#3A8A9E" stroke-width="1" />
  <text x="430" y="187" text-anchor="middle" class="agent-name" fill="#3A8A9E">Orch</text>

  <rect x="490" y="165" width="80" height="35" rx="4" fill="rgba(69,209,179,0.08)" stroke="#5487B5" stroke-width="1" />
  <text x="530" y="187" text-anchor="middle" class="agent-name" fill="#5487B5">Struct</text>

  <rect x="590" y="165" width="80" height="35" rx="4" fill="rgba(69,209,179,0.08)" stroke="#D9A84A" stroke-width="1" />
  <text x="630" y="187" text-anchor="middle" class="agent-name" fill="#D9A84A">MEP</text>

  <rect x="690" y="165" width="80" height="35" rx="4" fill="rgba(69,209,179,0.08)" stroke="#C85A3A" stroke-width="1" />
  <text x="730" y="187" text-anchor="middle" class="agent-name" fill="#C85A3A">Cost</text>

  <rect x="790" y="165" width="80" height="35" rx="4" fill="rgba(69,209,179,0.08)" stroke="#8A6BBF" stroke-width="1" />
  <text x="830" y="187" text-anchor="middle" class="agent-name" fill="#8A6BBF">Code</text>

  <rect x="890" y="165" width="90" height="35" rx="4" fill="rgba(69,209,179,0.08)" stroke="#45d1b3" stroke-width="1" />
  <text x="935" y="187" text-anchor="middle" class="agent-name" fill="#45d1b3">Planner</text>

  <!-- =========================================== -->
  <!-- MIDDLE ROW: BROWSER (Client) -->
  <!-- =========================================== -->
  <rect x="100" y="290" width="560" height="220" rx="8" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="380" y="315" text-anchor="middle" class="layer-title" fill="#E7E5D9">BROWSER</text>
  <text x="380" y="335" text-anchor="middle" class="box-desc" fill="#E7E5D9">Vanilla JS + ES Modules</text>

  <!-- Sub-components -->
  <rect x="130" y="355" width="150" height="45" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(231,229,217,0.2)" stroke-width="1" />
  <text x="205" y="375" text-anchor="middle" class="box-label" font-size="9">PHASER OFFICE</text>
  <text x="205" y="393" text-anchor="middle" class="box-desc" font-size="12" fill="#E7E5D9">FPV + sprites</text>

  <rect x="300" y="355" width="150" height="45" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(231,229,217,0.2)" stroke-width="1" />
  <text x="375" y="375" text-anchor="middle" class="box-label" font-size="9">PICKER UI</text>
  <text x="375" y="393" text-anchor="middle" class="box-desc" font-size="12" fill="#E7E5D9">5-step selection</text>

  <rect x="470" y="355" width="160" height="45" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(231,229,217,0.2)" stroke-width="1" />
  <text x="550" y="375" text-anchor="middle" class="box-label" font-size="9">CHAT INTERFACE</text>
  <text x="550" y="393" text-anchor="middle" class="box-desc" font-size="12" fill="#E7E5D9">Agent dialogue</text>

  <!-- Agent state -->
  <rect x="130" y="420" width="500" height="40" rx="4" fill="rgba(69,209,179,0.08)" stroke="#45d1b3" stroke-width="1" />
  <text x="380" y="440" text-anchor="middle" class="box-label" font-size="9">DESIGN PARAMETERS (STATE)</text>
  <text x="380" y="455" text-anchor="middle" class="box-desc" font-size="11" fill="#E7E5D9">floors, span, wwRatio, orientation, sectionType, planType...</text>

  <!-- Arrow: Gemini ↔ Browser -->
  <text x="620" y="258" text-anchor="middle" class="step-num">1</text>
  <line x1="630" y1="232" x2="630" y2="270" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="624,268 630,281 636,268" fill="#45d1b3" />
  <text x="560" y="258" text-anchor="end" class="flow-label">Prompt + params</text>

  <text x="770" y="258" text-anchor="middle" class="step-num">2</text>
  <line x1="770" y1="288" x2="770" y2="250" stroke="rgba(138,130,118,0.5)" stroke-width="1.5" stroke-dasharray="5,3" />
  <polygon points="764,252 770,239 776,252" fill="rgba(138,130,118,0.6)" />
  <text x="850" y="258" text-anchor="start" class="flow-label">Agent response</text>

  <!-- =========================================== -->
  <!-- MIDDLE ROW: LOCAL SERVER -->
  <!-- =========================================== -->
  <rect x="740" y="290" width="280" height="220" rx="8" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="880" y="315" text-anchor="middle" class="layer-title" fill="#E7E5D9">LOCAL SERVER</text>
  <text x="880" y="335" text-anchor="middle" class="box-desc" fill="#E7E5D9">serve.py (Python)</text>

  <rect x="770" y="355" width="220" height="35" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(231,229,217,0.2)" stroke-width="1" />
  <text x="880" y="378" text-anchor="middle" class="box-label" font-size="8">POST /gh-inputs</text>

  <rect x="770" y="400" width="220" height="35" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(231,229,217,0.2)" stroke-width="1" />
  <text x="880" y="423" text-anchor="middle" class="box-label" font-size="8">.gh-inputs.json</text>

  <rect x="770" y="445" width="220" height="35" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(231,229,217,0.2)" stroke-width="1" />
  <text x="880" y="468" text-anchor="middle" class="box-label" font-size="8">params.json + snapshots</text>

  <!-- Arrow: Browser → Server -->
  <text x="680" y="380" text-anchor="middle" class="step-num">3</text>
  <line x1="662" y1="400" x2="758" y2="372" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="756,366 770,369 758,378" fill="#45d1b3" />
  <text x="700" y="410" text-anchor="middle" class="flow-label-accent">POST params</text>

  <!-- Arrow: Server → Browser (return) -->
  <text x="680" y="455" text-anchor="middle" class="step-num">6</text>
  <line x1="768" y1="462" x2="662" y2="450" stroke="rgba(138,130,118,0.5)" stroke-width="1.5" stroke-dasharray="5,3" />
  <polygon points="664,444 650,448 662,456" fill="rgba(138,130,118,0.6)" />
  <text x="700" y="476" text-anchor="middle" class="flow-label">Poll results</text>

  <!-- =========================================== -->
  <!-- BOTTOM ROW: RHINO + GRASSHOPPER -->
  <!-- =========================================== -->
  <rect x="620" y="570" width="400" height="140" rx="8" fill="#413C36" stroke="#45d1b3" stroke-width="1.5" />
  <text x="820" y="598" text-anchor="middle" class="layer-title" fill="#45d1b3">RHINO + GRASSHOPPER</text>

  <rect x="650" y="618" width="110" height="35" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(69,209,179,0.4)" stroke-width="1" />
  <text x="705" y="641" text-anchor="middle" class="box-label" font-size="8">MASSING</text>

  <rect x="775" y="618" width="110" height="35" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(69,209,179,0.4)" stroke-width="1" />
  <text x="830" y="641" text-anchor="middle" class="box-label" font-size="8">KARAMBA</text>

  <rect x="650" y="663" width="110" height="35" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(69,209,179,0.4)" stroke-width="1" />
  <text x="705" y="686" text-anchor="middle" class="box-label" font-size="8">WINDOWS</text>

  <rect x="775" y="663" width="110" height="35" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(69,209,179,0.4)" stroke-width="1" />
  <text x="830" y="686" text-anchor="middle" class="box-label" font-size="8">LADYBUG</text>

  <rect x="900" y="618" width="100" height="80" rx="4" fill="rgba(245,243,234,0.08)" stroke="rgba(69,209,179,0.4)" stroke-width="1" />
  <text x="950" y="650" text-anchor="middle" class="box-label" font-size="8">EXPORT</text>
  <text x="950" y="670" text-anchor="middle" class="box-desc" font-size="11" fill="#E7E5D9">params.json</text>
  <text x="950" y="688" text-anchor="middle" class="box-desc" font-size="11" fill="#E7E5D9">snapshots</text>

  <!-- Arrow: Server → GH -->
  <text x="915" y="535" text-anchor="middle" class="step-num">4</text>
  <line x1="880" y1="512" x2="880" y2="558" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="874,556 880,569 886,556" fill="#45d1b3" />
  <text x="920" y="548" text-anchor="start" class="flow-label-accent">File watch</text>

  <!-- Arrow: GH → Server -->
  <text x="830" y="535" text-anchor="middle" class="step-num">5</text>
  <line x1="840" y1="568" x2="840" y2="522" stroke="rgba(138,130,118,0.5)" stroke-width="1.5" stroke-dasharray="5,3" />
  <polygon points="834,524 840,511 846,524" fill="rgba(138,130,118,0.6)" />
  <text x="800" y="548" text-anchor="end" class="flow-label">Write results</text>

  <!-- =========================================== -->
  <!-- roundToken annotation -->
  <!-- =========================================== -->
  <rect x="130" y="555" width="380" height="90" rx="6" fill="rgba(69,209,179,0.08)" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="320" y="580" text-anchor="middle" class="box-label" font-size="9" fill="#C85A3A">ROUND-SYNC PROTOCOL</text>
  <text x="320" y="605" text-anchor="middle" class="box-desc" font-size="12" fill="#413C36">Browser sends roundToken with params</text>
  <text x="320" y="625" text-anchor="middle" class="box-desc" font-size="12" fill="#413C36">GH echoes token back in params.json</text>
  <text x="320" y="645" text-anchor="middle" class="box-desc" font-size="12" fill="#413C36">Browser polls until token matches</text>

  <!-- =========================================== -->
  <!-- KEY INSIGHT -->
  <!-- =========================================== -->
  <rect x="100" y="730" width="1200" height="40" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="700" y="756" text-anchor="middle" font-family="'Open Sauce', 'Open Sans', sans-serif" font-size="14" font-weight="400" fill="#E7E5D9">Gemini provides the <tspan fill="#45d1b3" font-weight="600">reasoning</tspan>  |  Grasshopper provides the <tspan fill="#45d1b3" font-weight="600">geometry + analysis</tspan>  |  serve.py bridges them via <tspan fill="#C85A3A" font-weight="600">files</tspan></text>

  <!-- Annotation -->
  <text x="100" y="790" class="annotation">RUNTIME ARCHITECTURE</text>
</svg>
