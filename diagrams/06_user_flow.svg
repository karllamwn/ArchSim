<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .title { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: #E7E5D9; font-weight: 700; }
      .subtitle { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 7px; fill: #E7E5D9; font-weight: 600; }
      .label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; fill: #E7E5D9; font-weight: 600; }
      .desc { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: rgba(231,229,217,0.75); }
      .small { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; fill: rgba(138,130,118,0.7); }
      .branch-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 8px; fill: #45d1b3; font-weight: 700; }
      .diamond-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 8px; fill: #E7E5D9; font-weight: 700; }
      .circle-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; fill: #413C36; font-weight: 700; }
      .loop-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; fill: #45d1b3; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#F5F3EA"/>

  <!-- Page Title -->
  <text x="700" y="36" text-anchor="middle" font-family="'Kudryashev Display', Georgia, serif" font-size="18" fill="#413C36">ArchSim User Journey</text>

  <!-- ===================== START CIRCLE ===================== -->
  <circle cx="700" cy="72" r="22" fill="#45d1b3"/>
  <text x="700" y="76" text-anchor="middle" class="circle-text" font-size="9">START</text>

  <!-- Arrow: START -> Client Brief -->
  <line x1="700" y1="94" x2="700" y2="114" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,110 700,118 706,110" fill="#45d1b3"/>

  <!-- ===================== CLIENT BRIEF ===================== -->
  <rect x="560" y="118" width="280" height="50" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="700" y="140" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">Client Brief Input</text>
  <text x="700" y="157" text-anchor="middle" class="desc" fill="rgba(231,229,217,0.75)" font-size="11">Natural language project description</text>

  <!-- Arrow: Client Brief -> Orchestrator -->
  <line x1="700" y1="168" x2="700" y2="188" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,184 700,192 706,184" fill="#45d1b3"/>

  <!-- ===================== ORCHESTRATOR ===================== -->
  <rect x="540" y="192" width="320" height="50" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="700" y="214" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">Orchestrator Parses Brief</text>
  <text x="700" y="231" text-anchor="middle" class="desc" fill="rgba(231,229,217,0.75)" font-size="11">Extracts constraints, sets agent order</text>

  <!-- Arrow: Orchestrator -> Diamond -->
  <line x1="700" y1="242" x2="700" y2="268" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,264 700,272 706,264" fill="#45d1b3"/>

  <!-- ===================== DIAMOND: Choose Mode ===================== -->
  <polygon points="700,272 780,312 700,352 620,312" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="700" y="309" text-anchor="middle" class="diamond-text" font-size="9">CHOOSE</text>
  <text x="700" y="323" text-anchor="middle" class="diamond-text" font-size="9">MODE</text>

  <!-- ===================== LEFT BRANCH LABEL ===================== -->
  <!-- Arrow: Diamond left -->
  <line x1="620" y1="312" x2="380" y2="312" stroke="#45d1b3" stroke-width="1.5"/>
  <line x1="380" y1="312" x2="380" y2="380" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="374,376 380,384 386,376" fill="#45d1b3"/>
  <text x="480" y="302" text-anchor="middle" class="branch-label" fill="#45d1b3">DESIGN FROM</text>
  <text x="480" y="316" text-anchor="middle" class="branch-label" fill="#45d1b3">BEGINNING</text>

  <!-- ===================== RIGHT BRANCH LABEL ===================== -->
  <!-- Arrow: Diamond right -->
  <line x1="780" y1="312" x2="1020" y2="312" stroke="#45d1b3" stroke-width="1.5"/>
  <line x1="1020" y1="312" x2="1020" y2="380" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1014,376 1020,384 1026,376" fill="#45d1b3"/>
  <text x="920" y="302" text-anchor="middle" class="branch-label" fill="#45d1b3">SYNC FROM</text>
  <text x="920" y="316" text-anchor="middle" class="branch-label" fill="#45d1b3">GRASSHOPPER</text>

  <!-- ===================== LEFT: 5-Step Picker (Accent box) ===================== -->
  <rect x="240" y="384" width="280" height="56" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="380" y="405" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">5-Step Picker</text>
  <text x="380" y="425" text-anchor="middle" class="desc" fill="rgba(231,229,217,0.75)" font-size="11">Floors &#8594; Base Shape &#8594; Section &#8594; Plan &#8594; Window</text>

  <!-- Arrow -->
  <line x1="380" y1="440" x2="380" y2="462" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="374,458 380,466 386,458" fill="#45d1b3"/>

  <!-- ===================== LEFT: Consult Agents ===================== -->
  <rect x="240" y="466" width="280" height="56" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="380" y="488" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">Consult Agents</text>
  <text x="380" y="507" text-anchor="middle" class="desc" fill="rgba(231,229,217,0.75)" font-size="11">Walk to desks, ask questions via WASD+E</text>

  <!-- Arrow -->
  <line x1="380" y1="522" x2="380" y2="544" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="374,540 380,548 386,540" fill="#45d1b3"/>

  <!-- ===================== LEFT: Lock In Design ===================== -->
  <rect x="270" y="548" width="220" height="44" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="380" y="575" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">Lock In Design</text>

  <!-- Arrow: Lock In -> Merge -->
  <line x1="380" y1="592" x2="380" y2="660" stroke="#45d1b3" stroke-width="1.5"/>
  <line x1="380" y1="660" x2="694" y2="660" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="690,654 700,660 690,666" fill="#45d1b3"/>

  <!-- ===================== RIGHT: Connect to GH ===================== -->
  <rect x="880" y="384" width="280" height="50" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="1020" y="405" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">Connect to Live GH Model</text>
  <text x="1020" y="422" text-anchor="middle" class="desc" fill="rgba(231,229,217,0.75)" font-size="11">Real-time Grasshopper link</text>

  <!-- Arrow -->
  <line x1="1020" y1="434" x2="1020" y2="460" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1014,456 1020,464 1026,456" fill="#45d1b3"/>

  <!-- ===================== RIGHT: Params Auto-Sync ===================== -->
  <rect x="880" y="464" width="280" height="50" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="1020" y="485" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">Parameters Auto-Sync</text>
  <text x="1020" y="502" text-anchor="middle" class="desc" fill="rgba(231,229,217,0.75)" font-size="11">Sliders &amp; values stay in sync</text>

  <!-- Arrow: Params -> Merge -->
  <line x1="1020" y1="514" x2="1020" y2="660" stroke="#45d1b3" stroke-width="1.5"/>
  <line x1="1020" y1="660" x2="706" y2="660" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="710,654 700,660 710,666" fill="#45d1b3"/>

  <!-- ===================== MERGE POINT (small circle) ===================== -->
  <circle cx="700" cy="660" r="6" fill="#45d1b3"/>

  <!-- Arrow: Merge -> GH Solves -->
  <line x1="700" y1="666" x2="700" y2="690" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,686 700,694 706,686" fill="#45d1b3"/>

  <!-- ===================== GH Solves Geometry ===================== -->
  <rect x="530" y="694" width="340" height="50" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="700" y="715" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">GH Solves Geometry</text>
  <text x="700" y="733" text-anchor="middle" class="desc" fill="rgba(231,229,217,0.75)" font-size="11">Massing + Structure + Windows</text>

  <!-- Arrow: GH Solves -> Discussion -->
  <line x1="700" y1="744" x2="700" y2="770" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,766 700,774 706,766" fill="#45d1b3"/>

  <!-- ===================== Multi-Round Discussion (Accent box) ===================== -->
  <rect x="480" y="774" width="440" height="60" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="700" y="797" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">Multi-Round Agent Discussion</text>
  <text x="700" y="818" text-anchor="middle" class="desc" fill="rgba(231,229,217,0.75)" font-size="11">Agents propose changes &#8594; Planner synthesizes &#8594; GH re-solves</text>

  <!-- ===================== LOOP ARROW ===================== -->
  <!-- Right side loop: from Discussion back up to GH Solves -->
  <path d="M 920,804 L 960,804 L 960,719 L 874,719" fill="none" stroke="#45d1b3" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="878,713 868,719 878,725" fill="#45d1b3"/>
  <text x="990" y="768" text-anchor="start" class="loop-label" fill="#45d1b3">Iterate until</text>
  <text x="990" y="782" text-anchor="start" class="loop-label" fill="#45d1b3">converged</text>

  <!-- Arrow: Discussion -> Final Output -->
  <line x1="700" y1="834" x2="700" y2="862" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,858 700,866 706,858" fill="#45d1b3"/>

  <!-- ===================== Final Design Output (Accent box) ===================== -->
  <rect x="480" y="866" width="440" height="60" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="700" y="889" text-anchor="middle" class="title" fill="#E7E5D9" font-size="11">Final Design Output</text>
  <text x="700" y="910" text-anchor="middle" class="desc" fill="rgba(231,229,217,0.75)" font-size="11">Negotiated parameters + 3D model + agent logs</text>

  <!-- Arrow: Final -> END -->
  <line x1="700" y1="926" x2="700" y2="946" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,942 700,950 706,942" fill="#45d1b3"/>

  <!-- ===================== END CIRCLE ===================== -->
  <circle cx="700" cy="970" r="20" fill="rgba(138,130,118,0.5)"/>
  <text x="700" y="974" text-anchor="middle" class="circle-text" font-size="9" fill="#413C36">END</text>

</svg>
