<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .page-title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 22px; fill: #45d1b3; letter-spacing: 2px; }
      .subtitle { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 15px; fill: #8A8276; font-style: italic; }
      .node-title { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; fill: #E7E5D9; font-weight: 700; }
      .node-desc { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 12px; fill: rgba(231,229,217,0.8); }
      .branch-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: #45d1b3; font-weight: 700; letter-spacing: 1px; }
      .diamond-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: #E7E5D9; font-weight: 700; }
      .circle-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: #413C36; font-weight: 700; }
      .loop-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; fill: #45d1b3; font-style: italic; }
      .annotation { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; font-weight: 600; fill: rgba(138,130,118,0.7); letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#F5F3EA"/>

  <!-- Page Title -->
  <text x="700" y="42" text-anchor="middle" class="page-title">ARCHSIM USER JOURNEY</text>
  <text x="700" y="66" text-anchor="middle" class="subtitle">Two modes of entry — one negotiated outcome</text>

  <!-- START circle -->
  <circle cx="700" cy="105" r="22" fill="#45d1b3"/>
  <text x="700" y="110" text-anchor="middle" class="circle-text" font-size="11">START</text>

  <!-- Arrow: START -> Client Brief -->
  <line x1="700" y1="127" x2="700" y2="147" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,143 700,151 706,143" fill="#45d1b3"/>

  <!-- CLIENT BRIEF -->
  <rect x="560" y="151" width="280" height="55" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="700" y="175" text-anchor="middle" class="node-title">Client Brief Input</text>
  <text x="700" y="194" text-anchor="middle" class="node-desc">Natural language project description</text>

  <!-- Arrow: Brief -> Orchestrator -->
  <line x1="700" y1="206" x2="700" y2="226" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,222 700,230 706,222" fill="#45d1b3"/>

  <!-- ORCHESTRATOR -->
  <rect x="540" y="230" width="320" height="55" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="700" y="254" text-anchor="middle" class="node-title">Orchestrator Parses Brief</text>
  <text x="700" y="273" text-anchor="middle" class="node-desc">Extracts constraints · Sets agent order</text>

  <!-- Arrow: Orchestrator -> Diamond -->
  <line x1="700" y1="285" x2="700" y2="305" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,301 700,309 706,301" fill="#45d1b3"/>

  <!-- Diamond CHOOSE MODE -->
  <polygon points="700,310 790,355 700,400 610,355" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="700" y="350" text-anchor="middle" class="diamond-text">CHOOSE</text>
  <text x="700" y="367" text-anchor="middle" class="diamond-text">MODE</text>

  <!-- LEFT BRANCH: PICKER MODE -->
  <line x1="610" y1="355" x2="370" y2="355" stroke="#45d1b3" stroke-width="1.5"/>
  <line x1="370" y1="355" x2="370" y2="425" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="364,421 370,429 376,421" fill="#45d1b3"/>
  <text x="490" y="338" text-anchor="middle" class="branch-label">MODE A</text>
  <text x="490" y="354" text-anchor="middle" class="branch-label">PICKER (MANUAL)</text>

  <!-- RIGHT BRANCH: AUTO MODE -->
  <line x1="790" y1="355" x2="1030" y2="355" stroke="#45d1b3" stroke-width="1.5"/>
  <line x1="1030" y1="355" x2="1030" y2="425" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1024,421 1030,429 1036,421" fill="#45d1b3"/>
  <text x="910" y="338" text-anchor="middle" class="branch-label">MODE B</text>
  <text x="910" y="354" text-anchor="middle" class="branch-label">AUTO (AGENT-DRIVEN MDO)</text>

  <!-- LEFT: 5-Step Picker -->
  <rect x="230" y="429" width="280" height="62" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="370" y="454" text-anchor="middle" class="node-title">5-Step Picker</text>
  <text x="370" y="476" text-anchor="middle" class="node-desc">Floors → Base → Section → Plan → Window</text>

  <!-- Arrow -->
  <line x1="370" y1="491" x2="370" y2="513" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="364,509 370,517 376,509" fill="#45d1b3"/>

  <!-- LEFT: Consult Agents 1-on-1 -->
  <rect x="230" y="517" width="280" height="62" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="370" y="542" text-anchor="middle" class="node-title">Consult Agents 1-on-1</text>
  <text x="370" y="564" text-anchor="middle" class="node-desc">Architect selects · Agents interpret</text>

  <!-- Arrow -->
  <line x1="370" y1="579" x2="370" y2="601" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="364,597 370,605 376,597" fill="#45d1b3"/>

  <!-- LEFT: Lock In Design -->
  <rect x="260" y="605" width="220" height="50" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="370" y="635" text-anchor="middle" class="node-title">Lock In Design</text>

  <!-- Arrow: Lock In -> Merge -->
  <line x1="370" y1="655" x2="370" y2="720" stroke="#45d1b3" stroke-width="1.5"/>
  <line x1="370" y1="720" x2="694" y2="720" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="690,714 700,720 690,726" fill="#45d1b3"/>

  <!-- RIGHT: Agents Auto-Propose -->
  <rect x="890" y="429" width="280" height="62" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="1030" y="454" text-anchor="middle" class="node-title">Agents Auto-Propose</text>
  <text x="1030" y="476" text-anchor="middle" class="node-desc">Each agent proposes parameter changes</text>

  <!-- Arrow -->
  <line x1="1030" y1="491" x2="1030" y2="513" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1024,509 1030,517 1036,509" fill="#45d1b3"/>

  <!-- RIGHT: Architect Arbitrates -->
  <rect x="890" y="517" width="280" height="62" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="1030" y="542" text-anchor="middle" class="node-title">Architect Arbitrates</text>
  <text x="1030" y="564" text-anchor="middle" class="node-desc">Approves / overrides agent proposals</text>

  <!-- Arrow -->
  <line x1="1030" y1="579" x2="1030" y2="601" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1024,597 1030,605 1036,597" fill="#45d1b3"/>

  <!-- RIGHT: Accept Negotiated Set -->
  <rect x="920" y="605" width="220" height="50" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="1030" y="635" text-anchor="middle" class="node-title">Accept Negotiated Set</text>

  <!-- Arrow: Auto -> Merge -->
  <line x1="1030" y1="655" x2="1030" y2="720" stroke="#45d1b3" stroke-width="1.5"/>
  <line x1="1030" y1="720" x2="706" y2="720" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="710,714 700,720 710,726" fill="#45d1b3"/>

  <!-- Merge point -->
  <circle cx="700" cy="720" r="6" fill="#45d1b3"/>

  <!-- Arrow: Merge -> GH Solves -->
  <line x1="700" y1="726" x2="700" y2="750" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,746 700,754 706,746" fill="#45d1b3"/>

  <!-- GH Solves Geometry -->
  <rect x="520" y="754" width="360" height="56" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="700" y="779" text-anchor="middle" class="node-title">Grasshopper Solves Geometry</text>
  <text x="700" y="798" text-anchor="middle" class="node-desc">Massing + Structure + Windows + Analysis</text>

  <!-- Arrow: GH -> Discussion -->
  <line x1="700" y1="810" x2="700" y2="830" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,826 700,834 706,826" fill="#45d1b3"/>

  <!-- Multi-Round Discussion -->
  <rect x="460" y="834" width="480" height="64" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="700" y="860" text-anchor="middle" class="node-title">Multi-Round Agent Discussion</text>
  <text x="700" y="882" text-anchor="middle" class="node-desc">Agents propose → Planner synthesizes → GH re-solves</text>

  <!-- LOOP arrow -->
  <path d="M 940,866 L 980,866 L 980,782 L 884,782" fill="none" stroke="#45d1b3" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="888,776 878,782 888,788" fill="#45d1b3"/>
  <text x="1010" y="818" text-anchor="start" class="loop-label">Iterate until</text>
  <text x="1010" y="836" text-anchor="start" class="loop-label">converged</text>

  <!-- Arrow: Discussion -> Final -->
  <line x1="700" y1="898" x2="700" y2="920" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="694,916 700,924 706,916" fill="#45d1b3"/>

  <!-- Final Design Output -->
  <rect x="460" y="924" width="480" height="50" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="2"/>
  <text x="700" y="948" text-anchor="middle" class="node-title">Final Design + Decision Log</text>
  <text x="700" y="964" text-anchor="middle" class="node-desc">Negotiated parameters · 3D model · Auditable rationale</text>

  <!-- Annotation -->
  <text x="100" y="990" class="annotation">USER JOURNEY · TWO MODES</text>
</svg>
