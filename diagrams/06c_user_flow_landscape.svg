<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" width="1700" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .page-title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 22px; fill: #45d1b3; letter-spacing: 2px; }
      .subtitle { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 15px; fill: #8A8276; font-style: italic; }
      .node-title { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; fill: #E7E5D9; font-weight: 700; }
      .node-desc { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: rgba(231,229,217,0.8); }
      .screen-id { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; fill: rgba(231,229,217,0.5); font-weight: 600; letter-spacing: 1px; }
      .branch-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 12px; fill: #45d1b3; font-weight: 700; letter-spacing: 1px; }
      .diamond-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: #E7E5D9; font-weight: 700; }
      .circle-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: #413C36; font-weight: 700; }
      .loop-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 12px; fill: #45d1b3; font-style: italic; }
      .annotation { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; font-weight: 600; fill: rgba(138,130,118,0.7); letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1700" height="800" fill="#F5F3EA"/>

  <!-- Page Title -->
  <text x="850" y="42" text-anchor="middle" class="page-title">ARCHSIM USER JOURNEY</text>
  <text x="850" y="66" text-anchor="middle" class="subtitle">Mode chosen at splash · Two paths · One negotiated outcome</text>

  <!-- =================================================== -->
  <!-- START CIRCLE -->
  <!-- =================================================== -->
  <circle cx="60" cy="400" r="24" fill="#45d1b3"/>
  <text x="60" y="405" text-anchor="middle" class="circle-text" font-size="11">START</text>

  <!-- Arrow START → Splash -->
  <line x1="84" y1="400" x2="118" y2="400" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="118,393 130,400 118,407" fill="#45d1b3"/>

  <!-- =================================================== -->
  <!-- SPLASH / MODE SELECTION -->
  <!-- =================================================== -->
  <rect x="135" y="360" width="180" height="80" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="225" y="385" text-anchor="middle" class="node-title">SPLASH</text>
  <text x="225" y="405" text-anchor="middle" class="node-desc">"Join the design meeting"</text>
  <text x="225" y="421" text-anchor="middle" class="node-desc">or "Watch the MDO run"</text>
  <text x="225" y="438" text-anchor="middle" class="screen-id">[s1]</text>

  <!-- Arrow Splash → Mode diamond -->
  <line x1="315" y1="400" x2="348" y2="400" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="348,393 360,400 348,407" fill="#45d1b3"/>

  <!-- Mode Diamond -->
  <polygon points="430,355 490,400 430,445 370,400" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="430" y="395" text-anchor="middle" class="diamond-text">CHOOSE</text>
  <text x="430" y="412" text-anchor="middle" class="diamond-text">MODE</text>

  <!-- =================================================== -->
  <!-- UPPER BRANCH: MANUAL (FPV) -->
  <!-- =================================================== -->

  <!-- Path from diamond UP and right -->
  <path d="M 430 355 L 430 210 L 560 210" fill="none" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="560,203 572,210 560,217" fill="#45d1b3"/>

  <!-- Branch label -->
  <text x="275" y="310" class="branch-label">MODE A · MANUAL (FPV)</text>
  <text x="275" y="328" class="node-desc" fill="#8A8276" font-size="11" font-style="italic">architect walks in 3D office</text>

  <!-- MANUAL: Step 1 — Brief Input -->
  <rect x="575" y="175" width="180" height="75" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="665" y="198" text-anchor="middle" class="node-title">Brief Input</text>
  <text x="665" y="218" text-anchor="middle" class="node-desc">Natural language</text>
  <text x="665" y="232" text-anchor="middle" class="node-desc">project description</text>
  <text x="665" y="246" text-anchor="middle" class="screen-id">[s2]</text>

  <!-- Arrow → Planner -->
  <line x1="755" y1="210" x2="790" y2="210" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="790,203 802,210 790,217" fill="#45d1b3"/>

  <!-- MANUAL: Step 2 — Planner parses -->
  <rect x="805" y="175" width="180" height="75" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="895" y="198" text-anchor="middle" class="node-title">Planner Parses</text>
  <text x="895" y="218" text-anchor="middle" class="node-desc">Extracts constraints,</text>
  <text x="895" y="232" text-anchor="middle" class="node-desc">suggests agent order</text>
  <text x="895" y="246" text-anchor="middle" class="screen-id">[s3]</text>

  <!-- Arrow → Select Agents -->
  <line x1="985" y1="210" x2="1020" y2="210" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1020,203 1032,210 1020,217" fill="#45d1b3"/>

  <!-- MANUAL: Step 3 — Select Agents -->
  <rect x="1035" y="175" width="180" height="75" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="1125" y="198" text-anchor="middle" class="node-title">Select Agents</text>
  <text x="1125" y="218" text-anchor="middle" class="node-desc">"Assemble your team" —</text>
  <text x="1125" y="232" text-anchor="middle" class="node-desc">pick consultants</text>
  <text x="1125" y="246" text-anchor="middle" class="screen-id">[s_select]</text>

  <!-- Arrow → Workspace FPV -->
  <line x1="1215" y1="210" x2="1250" y2="210" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1250,203 1262,210 1250,217" fill="#45d1b3"/>

  <!-- MANUAL: Step 4 — FPV Workspace -->
  <rect x="1265" y="170" width="200" height="85" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="1365" y="193" text-anchor="middle" class="node-title">FPV Workspace</text>
  <text x="1365" y="213" text-anchor="middle" class="node-desc">Phaser 3D office ·</text>
  <text x="1365" y="227" text-anchor="middle" class="node-desc">Picker + agent chats</text>
  <text x="1365" y="241" text-anchor="middle" class="screen-id">[s4 · FPV]</text>

  <!-- Arrow FPV → merge -->
  <path d="M 1365 255 L 1365 350 L 1025 350 L 1025 400" fill="none" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1018,400 1025,412 1032,400" fill="#45d1b3"/>

  <!-- =================================================== -->
  <!-- LOWER BRANCH: AUTOMATIC (God View) -->
  <!-- =================================================== -->

  <!-- Path from diamond DOWN and right -->
  <path d="M 430 445 L 430 590 L 560 590" fill="none" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="560,583 572,590 560,597" fill="#45d1b3"/>

  <!-- Branch label -->
  <text x="275" y="480" class="branch-label">MODE B · AUTOMATIC (GOD VIEW)</text>
  <text x="275" y="498" class="node-desc" fill="#8A8276" font-size="11" font-style="italic">watch the MDO process run</text>

  <!-- AUTO: Step 1 — Select Agents (first!) -->
  <rect x="575" y="555" width="180" height="75" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="665" y="578" text-anchor="middle" class="node-title">Select Agents</text>
  <text x="665" y="598" text-anchor="middle" class="node-desc">"Assemble your team" —</text>
  <text x="665" y="612" text-anchor="middle" class="node-desc">pick consultants</text>
  <text x="665" y="626" text-anchor="middle" class="screen-id">[s_select]</text>

  <!-- Arrow → Brief -->
  <line x1="755" y1="590" x2="790" y2="590" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="790,583 802,590 790,597" fill="#45d1b3"/>

  <!-- AUTO: Step 2 — Brief Input -->
  <rect x="805" y="555" width="180" height="75" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <text x="895" y="578" text-anchor="middle" class="node-title">Brief Input</text>
  <text x="895" y="598" text-anchor="middle" class="node-desc">Natural language</text>
  <text x="895" y="612" text-anchor="middle" class="node-desc">project description</text>
  <text x="895" y="626" text-anchor="middle" class="screen-id">[s_brief]</text>

  <!-- Arrow → God View Workspace -->
  <line x1="985" y1="590" x2="1250" y2="590" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1250,583 1262,590 1250,597" fill="#45d1b3"/>

  <!-- AUTO: Step 3 — God View Workspace -->
  <rect x="1265" y="550" width="200" height="85" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="1365" y="573" text-anchor="middle" class="node-title">God View Workspace</text>
  <text x="1365" y="593" text-anchor="middle" class="node-desc">Multi-agent discussion</text>
  <text x="1365" y="607" text-anchor="middle" class="node-desc">runs autonomously</text>
  <text x="1365" y="621" text-anchor="middle" class="screen-id">[s4 · God]</text>

  <!-- Arrow God View → merge -->
  <path d="M 1365 550 L 1365 450 L 1025 450 L 1025 400" fill="none" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1018,400 1025,412 1032,400" fill="#45d1b3"/>

  <!-- =================================================== -->
  <!-- MERGE & COMMON END-STATE -->
  <!-- =================================================== -->
  <circle cx="1025" cy="400" r="8" fill="#45d1b3"/>

  <!-- MULTI-ROUND NEGOTIATION (loop) -->
  <rect x="845" y="370" width="170" height="70" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="930" y="395" text-anchor="middle" class="node-title">Multi-Round</text>
  <text x="930" y="413" text-anchor="middle" class="node-title">Negotiation</text>
  <text x="930" y="430" text-anchor="middle" class="node-desc">(see diagram 08)</text>

  <!-- Arrow merge → Multi-Round -->
  <line x1="1017" y1="400" x2="1020" y2="400" stroke="#45d1b3" stroke-width="1.5"/>
  <line x1="1018" y1="400" x2="1022" y2="400" stroke="#45d1b3" stroke-width="0"/>
  <!-- (merge dot is directly adjacent to multi-round box, no need for long arrow) -->

  <!-- Loop around Multi-Round: if not converged -->
  <path d="M 845 385 L 810 385 L 810 425 L 845 425" fill="none" stroke="#C85A3A" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="839,419 851,425 839,431" fill="#C85A3A"/>
  <text x="700" y="408" text-anchor="middle" class="loop-label" fill="#C85A3A">if not converged</text>

  <!-- Arrow Multi-Round → Final (leftward) -->
  <line x1="845" y1="400" x2="555" y2="400" stroke="#45d1b3" stroke-width="2"/>
  <polygon points="555,393 543,400 555,407" fill="#45d1b3"/>
  <text x="700" y="445" text-anchor="middle" class="loop-label">if converged</text>

  <!-- FINAL DESIGN + DECISION LOG -->
  <rect x="340" y="360" width="200" height="80" rx="8" fill="#413C36" stroke="#45d1b3" stroke-width="2"/>
  <text x="440" y="385" text-anchor="middle" class="node-title">Final Design +</text>
  <text x="440" y="402" text-anchor="middle" class="node-title">Decision Log</text>
  <text x="440" y="421" text-anchor="middle" class="node-desc">Negotiated params ·</text>
  <text x="440" y="435" text-anchor="middle" class="node-desc">Auditable rationale</text>

  <!-- Arrow Final → END -->
  <line x1="340" y1="400" x2="180" y2="400" stroke="#45d1b3" stroke-width="2"/>
  <polygon points="180,393 168,400 180,407" fill="#45d1b3"/>

  <!-- END CIRCLE (at far-left, below START — or at same row, repositioned) -->
  <!-- Actually put END below START -->
  <circle cx="145" cy="400" r="22" fill="rgba(138,130,118,0.5)"/>
  <text x="145" y="405" text-anchor="middle" class="circle-text" font-size="11">END</text>

  <!-- Note: END arrow overlaps with Splash — adjust -->
  <!-- Better: put END below, offset from splash -->

  <!-- =================================================== -->
  <!-- Legend at bottom -->
  <!-- =================================================== -->
  <rect x="100" y="700" width="1500" height="55" rx="6" fill="rgba(69,209,179,0.04)" stroke="rgba(65,60,54,0.15)" stroke-width="1"/>
  <text x="130" y="725" font-family="'Open Sauce', 'Open Sans', sans-serif" font-size="13" fill="#413C36">
    <tspan font-weight="700" fill="#45d1b3">MANUAL (FPV):</tspan>
    <tspan> Splash → Brief [s2] → Planner [s3] → Select [s_select] → FPV Workspace [s4] · Architect walks in 3D office</tspan>
  </text>
  <text x="130" y="745" font-family="'Open Sauce', 'Open Sans', sans-serif" font-size="13" fill="#413C36">
    <tspan font-weight="700" fill="#45d1b3">AUTOMATIC (God):</tspan>
    <tspan> Splash → Select [s_select] → Brief [s_brief] → God View Workspace [s4] · Auto MDO until converged</tspan>
  </text>

  <!-- Annotation -->
  <text x="80" y="780" class="annotation">USER JOURNEY · ACTUAL SCREEN SEQUENCE · LANDSCAPE</text>
</svg>
