<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 22px; fill: #413C36; }
      .subtitle { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: #8A8276; }
      .step-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; fill: #45d1b3; font-weight: 700; }
      .step-name { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; fill: #413C36; font-weight: 700; }
      .box-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; fill: #E7E5D9; }
      .box-text-sm { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11.5px; fill: #E7E5D9; }
      .cond-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: #8A8276; font-style: italic; }
      .img-count { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; fill: rgba(138,130,118,0.7); }
      .highlight-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: #45d1b3; font-weight: 600; }
      .bottom-note { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; fill: #8A8276; font-weight: 600; }
      .bottom-note-sm { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; fill: rgba(138,130,118,0.7); }
      .path-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11.5px; fill: #45d1b3; font-weight: 600; }
      .option-list { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10.5px; fill: rgba(231,229,217,0.85); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#F5F3EA"/>

  <!-- Title -->
  <text x="700" y="52" text-anchor="middle" class="title">5-Step Design Picker</text>
  <text x="700" y="78" text-anchor="middle" class="subtitle">Each step's images reflect all prior picks</text>

  <!-- Thin horizontal guide line -->
  <line x1="90" y1="370" x2="1310" y2="370" stroke="rgba(65,60,54,0.12)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============================================================ -->
  <!-- STEP 1 — FLOOR COUNT -->
  <!-- ============================================================ -->
  <g transform="translate(100, 120)">
    <text x="80" y="0" text-anchor="middle" class="step-label">STEP 1</text>
    <text x="80" y="20" text-anchor="middle" class="step-name">FLOOR COUNT</text>

    <rect x="0" y="40" width="160" height="110" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
    <text x="80" y="68" text-anchor="middle" class="box-text" font-weight="600">6 options</text>
    <line x1="16" y1="78" x2="144" y2="78" stroke="rgba(231,229,217,0.3)" stroke-width="1"/>
    <text x="80" y="98" text-anchor="middle" class="option-list">6, 9, 12, 16, 20, 24</text>
    <text x="80" y="120" text-anchor="middle" class="box-text-sm">floors</text>
    <text x="80" y="140" text-anchor="middle" class="box-text-sm" fill="rgba(231,229,217,0.5)">____</text>

    <text x="80" y="172" text-anchor="middle" class="cond-label">Non-conditional</text>
    <text x="80" y="190" text-anchor="middle" class="img-count">6 images x 4 views = 24</text>
  </g>

  <!-- ============================================================ -->
  <!-- STEP 2 — BASE SHAPE -->
  <!-- ============================================================ -->
  <g transform="translate(340, 120)">
    <text x="80" y="0" text-anchor="middle" class="step-label">STEP 2</text>
    <text x="80" y="20" text-anchor="middle" class="step-name">BASE SHAPE</text>

    <rect x="0" y="40" width="160" height="110" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
    <text x="80" y="68" text-anchor="middle" class="box-text" font-weight="600">7 options</text>
    <line x1="16" y1="78" x2="144" y2="78" stroke="rgba(231,229,217,0.3)" stroke-width="1"/>
    <text x="80" y="98" text-anchor="middle" class="box-text-sm">per floor pick</text>
    <text x="80" y="118" text-anchor="middle" class="box-text-sm">(6 x 7 = 42 combos)</text>
    <text x="80" y="140" text-anchor="middle" class="box-text-sm" fill="rgba(231,229,217,0.5)">____</text>

    <text x="80" y="172" text-anchor="middle" class="cond-label">Conditional on Step 1</text>
    <text x="80" y="190" text-anchor="middle" class="img-count">7 x 4 = 28 images</text>

    <text x="80" y="212" text-anchor="middle" class="highlight-text">f=12 -&gt; 7 shapes</text>
  </g>

  <!-- ============================================================ -->
  <!-- STEP 3 — SECTION TYPE -->
  <!-- ============================================================ -->
  <g transform="translate(580, 120)">
    <text x="80" y="0" text-anchor="middle" class="step-label">STEP 3</text>
    <text x="80" y="20" text-anchor="middle" class="step-name">SECTION TYPE</text>

    <rect x="0" y="40" width="160" height="110" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
    <text x="80" y="68" text-anchor="middle" class="box-text" font-weight="600">5 options</text>
    <line x1="16" y1="78" x2="144" y2="78" stroke="rgba(231,229,217,0.3)" stroke-width="1"/>
    <text x="80" y="98" text-anchor="middle" class="box-text-sm">per base + floor</text>
    <text x="80" y="118" text-anchor="middle" class="box-text-sm">(42 x 5 = 210 combos)</text>
    <text x="80" y="140" text-anchor="middle" class="box-text-sm" fill="rgba(231,229,217,0.5)">____</text>

    <text x="80" y="172" text-anchor="middle" class="cond-label">Conditional on Steps 1-2</text>
    <text x="80" y="190" text-anchor="middle" class="img-count">7 x 5 x 4 = 140 images</text>
  </g>

  <!-- ============================================================ -->
  <!-- STEP 4 — PLAN TYPE -->
  <!-- ============================================================ -->
  <g transform="translate(820, 120)">
    <text x="80" y="0" text-anchor="middle" class="step-label">STEP 4</text>
    <text x="80" y="20" text-anchor="middle" class="step-name">PLAN TYPE</text>

    <rect x="0" y="40" width="160" height="110" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
    <text x="80" y="68" text-anchor="middle" class="box-text" font-weight="600">5 options</text>
    <line x1="16" y1="78" x2="144" y2="78" stroke="rgba(231,229,217,0.3)" stroke-width="1"/>
    <text x="80" y="98" text-anchor="middle" class="box-text-sm">per section + base</text>
    <text x="80" y="118" text-anchor="middle" class="box-text-sm">+ floor</text>
    <text x="80" y="140" text-anchor="middle" class="box-text-sm" fill="rgba(231,229,217,0.5)">____</text>

    <text x="80" y="172" text-anchor="middle" class="cond-label">Conditional on Steps 1-3</text>
    <text x="80" y="190" text-anchor="middle" class="img-count">7 x 5 x 5 x 4 = 700 images</text>
  </g>

  <!-- ============================================================ -->
  <!-- STEP 5 — WINDOW TYPE -->
  <!-- ============================================================ -->
  <g transform="translate(1060, 120)">
    <text x="80" y="0" text-anchor="middle" class="step-label">STEP 5</text>
    <text x="80" y="20" text-anchor="middle" class="step-name">WINDOW TYPE</text>

    <rect x="0" y="40" width="160" height="110" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
    <text x="80" y="68" text-anchor="middle" class="box-text" font-weight="600">4 options</text>
    <line x1="16" y1="78" x2="144" y2="78" stroke="rgba(231,229,217,0.3)" stroke-width="1"/>
    <text x="80" y="98" text-anchor="middle" class="box-text-sm">window patterns</text>
    <text x="80" y="118" text-anchor="middle" class="box-text-sm">(independent)</text>
    <text x="80" y="140" text-anchor="middle" class="box-text-sm" fill="rgba(231,229,217,0.5)">____</text>

    <text x="80" y="172" text-anchor="middle" class="cond-label">Static diagrams</text>
    <text x="80" y="190" text-anchor="middle" class="img-count">4 images</text>
  </g>

  <!-- ============================================================ -->
  <!-- CONNECTING ARROWS (grey dependency chain) with inline arrowheads -->
  <!-- ============================================================ -->
  <!-- Step 1 -> Step 2 -->
  <line x1="260" y1="225" x2="330" y2="225" stroke="rgba(138,130,118,0.7)" stroke-width="1.5"/>
  <polygon points="328,219 341,225 328,231" fill="rgba(138,130,118,0.7)"/>
  <!-- Step 2 -> Step 3 -->
  <line x1="500" y1="225" x2="570" y2="225" stroke="rgba(138,130,118,0.7)" stroke-width="1.5"/>
  <polygon points="568,219 581,225 568,231" fill="rgba(138,130,118,0.7)"/>
  <!-- Step 3 -> Step 4 -->
  <line x1="740" y1="225" x2="810" y2="225" stroke="rgba(138,130,118,0.7)" stroke-width="1.5"/>
  <polygon points="808,219 821,225 808,231" fill="rgba(138,130,118,0.7)"/>
  <!-- Step 4 -> Step 5 -->
  <line x1="980" y1="225" x2="1050" y2="225" stroke="rgba(138,130,118,0.7)" stroke-width="1.5"/>
  <polygon points="1048,219 1061,225 1048,231" fill="rgba(138,130,118,0.7)"/>

  <!-- ============================================================ -->
  <!-- HIGHLIGHTED EXAMPLE PATH -->
  <!-- ============================================================ -->

  <!-- Example path background bar -->
  <rect x="60" y="420" width="1280" height="220" rx="10" fill="#E7E5D9" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>

  <!-- Section label -->
  <text x="700" y="452" text-anchor="middle" class="step-label" font-size="11">EXAMPLE PATH</text>

  <!-- Gold path nodes — dark brown fill with teal accent border -->
  <!-- Node 1: 12F -->
  <rect x="110" y="478" width="140" height="50" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="180" y="500" text-anchor="middle" class="box-text" font-weight="600" font-size="14" fill="#E7E5D9">12 Floors</text>
  <text x="180" y="518" text-anchor="middle" class="box-text-sm" font-size="10" fill="rgba(231,229,217,0.75)">picked in Step 1</text>

  <!-- Node 2: Rectangle -->
  <rect x="350" y="478" width="140" height="50" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="420" y="500" text-anchor="middle" class="box-text" font-weight="600" font-size="14" fill="#E7E5D9">Rectangle</text>
  <text x="420" y="518" text-anchor="middle" class="box-text-sm" font-size="10" fill="rgba(231,229,217,0.75)">picked in Step 2</text>

  <!-- Node 3: Podium+Tower -->
  <rect x="590" y="478" width="140" height="50" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="660" y="497" text-anchor="middle" class="box-text" font-weight="600" font-size="13" fill="#E7E5D9">Podium</text>
  <text x="660" y="515" text-anchor="middle" class="box-text" font-weight="600" font-size="13" fill="#E7E5D9">+ Tower</text>

  <!-- Node 4: Courtyard -->
  <rect x="830" y="478" width="140" height="50" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="900" y="500" text-anchor="middle" class="box-text" font-weight="600" font-size="14" fill="#E7E5D9">Courtyard</text>
  <text x="900" y="518" text-anchor="middle" class="box-text-sm" font-size="10" fill="rgba(231,229,217,0.75)">picked in Step 4</text>

  <!-- Node 5: Ribbon -->
  <rect x="1070" y="478" width="140" height="50" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5"/>
  <text x="1140" y="500" text-anchor="middle" class="box-text" font-weight="600" font-size="14" fill="#E7E5D9">Ribbon</text>
  <text x="1140" y="518" text-anchor="middle" class="box-text-sm" font-size="10" fill="rgba(231,229,217,0.75)">picked in Step 5</text>

  <!-- Accent connecting arrows with inline arrowheads -->
  <line x1="250" y1="503" x2="340" y2="503" stroke="#45d1b3" stroke-width="2"/>
  <polygon points="338,497 351,503 338,509" fill="#45d1b3"/>
  <line x1="490" y1="503" x2="580" y2="503" stroke="#45d1b3" stroke-width="2"/>
  <polygon points="578,497 591,503 578,509" fill="#45d1b3"/>
  <line x1="730" y1="503" x2="820" y2="503" stroke="#45d1b3" stroke-width="2"/>
  <polygon points="818,497 831,503 818,509" fill="#45d1b3"/>
  <line x1="970" y1="503" x2="1060" y2="503" stroke="#45d1b3" stroke-width="2"/>
  <polygon points="1058,497 1071,503 1058,509" fill="#45d1b3"/>

  <!-- Narrowing funnel annotation under gold path -->
  <text x="180" y="556" text-anchor="middle" class="path-label">6 options</text>
  <text x="310" y="556" text-anchor="middle" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:14px;fill:#45d1b3;font-weight:700;">&gt;</text>
  <text x="420" y="556" text-anchor="middle" class="path-label">7 options</text>
  <text x="545" y="556" text-anchor="middle" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:14px;fill:#45d1b3;font-weight:700;">&gt;</text>
  <text x="660" y="556" text-anchor="middle" class="path-label">5 options</text>
  <text x="775" y="556" text-anchor="middle" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:14px;fill:#45d1b3;font-weight:700;">&gt;</text>
  <text x="900" y="556" text-anchor="middle" class="path-label">5 options</text>
  <text x="995" y="556" text-anchor="middle" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:14px;fill:#45d1b3;font-weight:700;">&gt;</text>
  <text x="1140" y="556" text-anchor="middle" class="path-label">4 options</text>

  <!-- Narrowing description -->
  <text x="700" y="586" text-anchor="middle" class="cond-label" font-size="12">
    Each pick narrows the next step's image set to only relevant combinations
  </text>

  <!-- Cumulative images bar -->
  <rect x="110" y="600" width="1100" height="30" rx="4" fill="none" stroke="rgba(65,60,54,0.2)" stroke-width="1"/>
  <rect x="110" y="600" width="30" height="30" rx="4" fill="rgba(69,209,179,0.25)"/>
  <rect x="110" y="600" width="100" height="30" rx="4" fill="rgba(69,209,179,0.2)"/>
  <rect x="110" y="600" width="300" height="30" rx="4" fill="rgba(69,209,179,0.15)"/>
  <rect x="110" y="600" width="850" height="30" rx="4" fill="rgba(69,209,179,0.1)"/>
  <rect x="110" y="600" width="1100" height="30" rx="4" fill="rgba(69,209,179,0.06)"/>
  <text x="135" y="620" text-anchor="start" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:10px;fill:#413C36;font-weight:600;">24</text>
  <text x="230" y="620" text-anchor="middle" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:10px;fill:#413C36;font-weight:600;">+ 28</text>
  <text x="400" y="620" text-anchor="middle" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:10px;fill:#413C36;font-weight:600;">+ 140</text>
  <text x="700" y="620" text-anchor="middle" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:10px;fill:#413C36;font-weight:600;">+ 700</text>
  <text x="1100" y="620" text-anchor="middle" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:10px;fill:#413C36;font-weight:600;">+ 4</text>
  <text x="1230" y="620" text-anchor="start" style="font-family:'Open Sauce','Open Sans',sans-serif;font-size:11px;fill:#413C36;font-weight:700;">= 896</text>

  <!-- ============================================================ -->
  <!-- BOTTOM ANNOTATIONS -->
  <!-- ============================================================ -->

  <!-- Divider -->
  <line x1="100" y1="680" x2="1300" y2="680" stroke="rgba(65,60,54,0.12)" stroke-width="1"/>

  <!-- Bottom left -->
  <text x="100" y="720" text-anchor="start" class="bottom-note">Total: 896 conditional images</text>
  <text x="100" y="745" text-anchor="start" class="bottom-note-sm">Generated via Grasshopper batch automation</text>

  <!-- Bottom right -->
  <text x="1300" y="720" text-anchor="end" class="bottom-note" fill="#45d1b3">Highlighted path</text>
  <text x="1300" y="745" text-anchor="end" class="bottom-note-sm">Shows how picks narrow the design space</text>

  <!-- Dependency chain legend at very bottom -->
  <g transform="translate(100, 780)">
    <line x1="0" y1="8" x2="25" y2="8" stroke="rgba(138,130,118,0.7)" stroke-width="1.5"/>
    <polygon points="23,2 36,8 23,14" fill="rgba(138,130,118,0.7)"/>
    <text x="46" y="12" class="img-count">Dependency (next step filtered by prior picks)</text>

    <line x1="350" y1="8" x2="375" y2="8" stroke="#45d1b3" stroke-width="2"/>
    <polygon points="373,2 386,8 373,14" fill="#45d1b3"/>
    <text x="396" y="12" class="img-count" fill="#45d1b3">Example path: 12F &gt; Rectangle &gt; Podium+Tower &gt; Courtyard &gt; Ribbon</text>
  </g>

</svg>
