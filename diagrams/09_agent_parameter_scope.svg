<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 18px; fill: #45d1b3; }
      .subtitle { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 16px; fill: #8A8276; font-style: italic; }
      .agent-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; }
      .cat-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 8px; fill: rgba(138,130,118,0.5); }
      .param-name { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 16px; font-weight: bold; fill: #E7E5D9; }
      .param-desc { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; fill: #8A8276; }
      .tension-title { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 8px; fill: #45d1b3; }
      .tension-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; fill: #E7E5D9; }
      .tension-vs { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; fill: #C85A3A; font-weight: bold; }
      .bottom-note { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 15px; fill: #8A8276; font-style: italic; text-anchor: middle; }
      .legend-dot-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; fill: #E7E5D9; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#F5F3EA"/>

  <!-- Title -->
  <text x="700" y="48" text-anchor="middle" class="title">Agent-Parameter Scope Map</text>
  <text x="700" y="72" text-anchor="middle" class="subtitle">Overlapping scopes create design trade-off negotiations</text>

  <!-- ============================== -->
  <!-- LEFT COLUMN: Agent Labels      -->
  <!-- ============================== -->
  <rect x="40" y="110" width="200" height="36" rx="4" fill="#5487B5"/>
  <text x="140" y="133" text-anchor="middle" class="agent-label" fill="#FFFFFF">STRUCTURAL</text>

  <rect x="40" y="158" width="200" height="36" rx="4" fill="#D9A84A"/>
  <text x="140" y="181" text-anchor="middle" class="agent-label" fill="#FFFFFF">MEP CONSULTANT</text>

  <rect x="40" y="206" width="200" height="36" rx="4" fill="#C85A3A"/>
  <text x="140" y="229" text-anchor="middle" class="agent-label" fill="#FFFFFF">COST CONSULTANT</text>

  <rect x="40" y="254" width="200" height="36" rx="4" fill="#8A6BBF"/>
  <text x="140" y="277" text-anchor="middle" class="agent-label" fill="#FFFFFF">CODE CONSULTANT</text>

  <rect x="40" y="302" width="200" height="36" rx="4" fill="#45d1b3"/>
  <text x="140" y="325" text-anchor="middle" class="agent-label" fill="#FFFFFF">ARCHITECT (HUMAN)</text>

  <!-- Legend: dot sizes -->
  <circle cx="60" cy="370" r="6" fill="rgba(138,130,118,0.5)"/>
  <text x="72" y="374" class="legend-dot-label">= Primary influence</text>
  <circle cx="60" cy="392" r="4" fill="rgba(138,130,118,0.5)" opacity="0.5"/>
  <text x="72" y="396" class="legend-dot-label">= Secondary influence</text>

  <!-- ============================== -->
  <!-- CENTER: Parameter Matrix       -->
  <!-- ============================== -->

  <!-- Column headers: agent color dots -->
  <circle cx="540" cy="118" r="6" fill="#5487B5"/>
  <circle cx="580" cy="118" r="6" fill="#D9A84A"/>
  <circle cx="620" cy="118" r="6" fill="#C85A3A"/>
  <circle cx="660" cy="118" r="6" fill="#8A6BBF"/>
  <circle cx="700" cy="118" r="6" fill="#45d1b3"/>
  <text x="540" y="108" text-anchor="middle" class="param-desc" fill="#5487B5">S</text>
  <text x="580" y="108" text-anchor="middle" class="param-desc" fill="#D9A84A">M</text>
  <text x="620" y="108" text-anchor="middle" class="param-desc" fill="#C85A3A">Co</text>
  <text x="660" y="108" text-anchor="middle" class="param-desc" fill="#8A6BBF">Cd</text>
  <text x="700" y="108" text-anchor="middle" class="param-desc" fill="#45d1b3">A</text>

  <!-- Separator line -->
  <line x1="280" y1="130" x2="740" y2="130" stroke="rgba(65,60,54,0.12)" stroke-width="1"/>

  <!-- ======= GEOMETRY ======= -->
  <text x="290" y="158" class="cat-label">GEOMETRY</text>
  <rect x="280" y="142" width="470" height="2" rx="1" fill="rgba(65,60,54,0.12)"/>

  <!-- floors -->
  <text x="390" y="172" class="param-name">floors</text>
  <circle cx="620" cy="168" r="6" fill="#C85A3A"/>
  <circle cx="660" cy="168" r="4" fill="#8A6BBF" opacity="0.5"/>
  <circle cx="700" cy="168" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- floorHeight -->
  <text x="390" y="198" class="param-name">floorHeight</text>
  <circle cx="540" cy="194" r="6" fill="#5487B5"/>
  <circle cx="700" cy="194" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- base_shape -->
  <text x="390" y="224" class="param-name">base_shape</text>
  <circle cx="700" cy="220" r="6" fill="#45d1b3"/>

  <!-- orientation -->
  <text x="390" y="250" class="param-name">orientation</text>
  <circle cx="580" cy="246" r="6" fill="#D9A84A"/>
  <circle cx="700" cy="246" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- ======= STRUCTURE ======= -->
  <text x="290" y="286" class="cat-label">STRUCTURE</text>
  <rect x="280" y="270" width="470" height="2" rx="1" fill="rgba(65,60,54,0.12)"/>

  <!-- structuralSpan -->
  <text x="390" y="302" class="param-name">structuralSpan</text>
  <circle cx="540" cy="298" r="6" fill="#5487B5"/>
  <circle cx="620" cy="298" r="4" fill="#C85A3A" opacity="0.5"/>

  <!-- column_size -->
  <text x="390" y="328" class="param-name">column_size</text>
  <circle cx="540" cy="324" r="6" fill="#5487B5"/>

  <!-- lateral_system -->
  <text x="390" y="354" class="param-name">lateral_system</text>
  <circle cx="540" cy="350" r="6" fill="#5487B5"/>
  <circle cx="620" cy="350" r="4" fill="#C85A3A" opacity="0.5"/>

  <!-- ======= ENVELOPE ======= -->
  <text x="290" y="392" class="cat-label">ENVELOPE</text>
  <rect x="280" y="376" width="470" height="2" rx="1" fill="rgba(65,60,54,0.12)"/>

  <!-- wwRatio -->
  <text x="390" y="408" class="param-name">wwRatio</text>
  <circle cx="580" cy="404" r="6" fill="#D9A84A"/>
  <circle cx="620" cy="404" r="4" fill="#C85A3A" opacity="0.5"/>
  <circle cx="700" cy="404" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- windowType -->
  <text x="390" y="434" class="param-name">windowType</text>
  <circle cx="580" cy="430" r="6" fill="#D9A84A"/>
  <circle cx="620" cy="430" r="4" fill="#C85A3A" opacity="0.5"/>
  <circle cx="700" cy="430" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- ======= MASSING ======= -->
  <text x="290" y="472" class="cat-label">MASSING</text>
  <rect x="280" y="456" width="470" height="2" rx="1" fill="rgba(65,60,54,0.12)"/>

  <!-- sectionType -->
  <text x="390" y="488" class="param-name">sectionType</text>
  <circle cx="540" cy="484" r="4" fill="#5487B5" opacity="0.5"/>
  <circle cx="620" cy="484" r="4" fill="#C85A3A" opacity="0.5"/>
  <circle cx="700" cy="484" r="6" fill="#45d1b3"/>

  <!-- planType -->
  <text x="390" y="514" class="param-name">planType</text>
  <circle cx="580" cy="510" r="4" fill="#D9A84A" opacity="0.5"/>
  <circle cx="620" cy="510" r="4" fill="#C85A3A" opacity="0.5"/>
  <circle cx="700" cy="510" r="6" fill="#45d1b3"/>

  <!-- tower_ratio -->
  <text x="390" y="540" class="param-name">tower_ratio</text>
  <circle cx="540" cy="536" r="4" fill="#5487B5" opacity="0.5"/>
  <circle cx="700" cy="536" r="6" fill="#45d1b3"/>

  <!-- Bottom separator -->
  <rect x="280" y="556" width="470" height="2" rx="1" fill="rgba(65,60,54,0.12)"/>

  <!-- ============================== -->
  <!-- Influence count summary bar    -->
  <!-- ============================== -->
  <text x="290" y="586" class="param-desc">Agents per parameter:</text>
  <!-- Single agent params -->
  <rect x="430" y="574" width="14" height="14" rx="2" fill="#413C36"/>
  <text x="437" y="585" text-anchor="middle" class="param-desc" font-weight="bold">1</text>
  <text x="450" y="585" class="param-desc">= Expert only</text>
  <!-- Multi agent params -->
  <rect x="530" y="574" width="14" height="14" rx="2" fill="rgba(69,209,179,0.06)"/>
  <text x="537" y="585" text-anchor="middle" class="param-desc" font-weight="bold">2+</text>
  <text x="550" y="585" class="param-desc">= Negotiation</text>

  <!-- Highlight rows with multiple agents (subtle background) -->
  <!-- floors row -->
  <rect x="282" y="157" width="466" height="22" rx="2" fill="rgba(69,209,179,0.06)"/>
  <!-- structuralSpan row -->
  <rect x="282" y="287" width="466" height="22" rx="2" fill="rgba(69,209,179,0.06)"/>
  <!-- wwRatio row -->
  <rect x="282" y="393" width="466" height="22" rx="2" fill="rgba(69,209,179,0.06)"/>

  <!-- ============================== -->
  <!-- RIGHT: Tension Zones           -->
  <!-- ============================== -->
  <rect x="790" y="105" width="560" height="470" rx="6" fill="none" stroke="#45d1b3" stroke-width="2"/>
  <rect x="790" y="105" width="560" height="32" rx="6" fill="#45d1b3"/>
  <rect x="790" y="125" width="560" height="12" fill="#45d1b3"/>
  <text x="1070" y="127" text-anchor="middle" class="agent-label" fill="#FFFFFF">TENSION ZONES</text>

  <!-- Tension 1: floors -->
  <rect x="810" y="155" width="520" height="110" rx="5" fill="#413C36"/>
  <text x="830" y="178" class="param-name" font-size="13">floors</text>
  <rect x="830" y="188" width="480" height="1" fill="rgba(65,60,54,0.12)"/>

  <!-- Cost side -->
  <circle cx="842" cy="210" r="5" fill="#C85A3A"/>
  <text x="855" y="214" class="tension-text" fill="#C85A3A" font-weight="bold">Cost Consultant</text>
  <text x="855" y="230" class="tension-text">wants fewer floors (cheaper construction)</text>

  <text x="1070" y="248" text-anchor="middle" class="tension-vs">VS</text>

  <!-- Architect side -->
  <circle cx="842" cy="256" r="5" fill="#45d1b3"/>
  <text x="855" y="260" class="tension-text" fill="#45d1b3" font-weight="bold">Architect</text>
  <text x="960" y="260" class="tension-text">wants more floors (maximize GFA)</text>

  <!-- Tension 2: wwRatio -->
  <rect x="810" y="280" width="520" height="110" rx="5" fill="#413C36"/>
  <text x="830" y="303" class="param-name" font-size="13">wwRatio</text>
  <rect x="830" y="313" width="480" height="1" fill="rgba(65,60,54,0.12)"/>

  <circle cx="842" cy="335" r="5" fill="#D9A84A"/>
  <text x="855" y="339" class="tension-text" fill="#D9A84A" font-weight="bold">MEP Consultant</text>
  <text x="855" y="355" class="tension-text">wants less glazing (reduce energy load)</text>

  <text x="1070" y="373" text-anchor="middle" class="tension-vs">VS</text>

  <circle cx="842" cy="381" r="5" fill="#45d1b3"/>
  <text x="855" y="385" class="tension-text" fill="#45d1b3" font-weight="bold">Architect</text>
  <text x="960" y="385" class="tension-text">wants more glazing (views + daylight)</text>

  <!-- Tension 3: structuralSpan -->
  <rect x="810" y="405" width="520" height="110" rx="5" fill="#413C36"/>
  <text x="830" y="428" class="param-name" font-size="13">structuralSpan</text>
  <rect x="830" y="438" width="480" height="1" fill="rgba(65,60,54,0.12)"/>

  <circle cx="842" cy="460" r="5" fill="#5487B5"/>
  <text x="855" y="464" class="tension-text" fill="#5487B5" font-weight="bold">Structural Engineer</text>
  <text x="855" y="480" class="tension-text">wants smaller spans (safer, efficient)</text>

  <text x="1070" y="498" text-anchor="middle" class="tension-vs">VS</text>

  <circle cx="842" cy="506" r="5" fill="#45d1b3"/>
  <text x="855" y="510" class="tension-text" fill="#45d1b3" font-weight="bold">Architect</text>
  <text x="960" y="510" class="tension-text">wants larger spans (open plan flexibility)</text>

  <!-- Connecting lines from highlighted params to tension zones -->
  <!-- floors -> tension 1 -->
  <line x1="748" y1="168" x2="810" y2="168" stroke="#45d1b3" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- structuralSpan -> tension 3 -->
  <line x1="748" y1="298" x2="810" y2="460" stroke="#45d1b3" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- wwRatio -> tension 2 -->
  <line x1="748" y1="404" x2="810" y2="340" stroke="#45d1b3" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- ============================== -->
  <!-- BOTTOM: Summary Insight        -->
  <!-- ============================== -->
  <rect x="100" y="620" width="1200" height="50" rx="6" fill="#413C36"/>
  <text x="700" y="650" class="bottom-note">
    Parameters with multiple agents = negotiation points where trade-offs emerge.
    Single-agent parameters = expert recommendations accepted directly.
  </text>

  <!-- Scope overlap visualization: mini bar chart -->
  <text x="290" y="720" class="cat-label">OVERLAP DENSITY</text>

  <!-- bars showing how many agents influence each param -->
  <!-- base_shape: 1 -->
  <text x="290" y="744" class="param-desc">base_shape</text>
  <rect x="400" y="734" width="30" height="12" rx="2" fill="#45d1b3"/>
  <text x="436" y="744" class="param-desc">1</text>

  <!-- column_size: 1 -->
  <text x="290" y="762" class="param-desc">column_size</text>
  <rect x="400" y="752" width="30" height="12" rx="2" fill="#5487B5"/>
  <text x="436" y="762" class="param-desc">1</text>

  <!-- floorHeight: 2 -->
  <text x="290" y="780" class="param-desc">floorHeight</text>
  <rect x="400" y="770" width="60" height="12" rx="2" fill="#5487B5"/>
  <rect x="430" y="770" width="30" height="12" rx="2" fill="#45d1b3"/>
  <text x="466" y="780" class="param-desc">2</text>

  <!-- orientation: 2 -->
  <text x="290" y="798" class="param-desc">orientation</text>
  <rect x="400" y="788" width="60" height="12" rx="2" fill="#D9A84A"/>
  <rect x="430" y="788" width="30" height="12" rx="2" fill="#45d1b3"/>
  <text x="466" y="798" class="param-desc">2</text>

  <!-- structuralSpan: 2 -->
  <text x="540" y="744" class="param-desc">structuralSpan</text>
  <rect x="660" y="734" width="60" height="12" rx="2" fill="#5487B5"/>
  <rect x="690" y="734" width="30" height="12" rx="2" fill="#C85A3A"/>
  <text x="726" y="744" class="param-desc">2</text>

  <!-- lateral_system: 2 -->
  <text x="540" y="762" class="param-desc">lateral_system</text>
  <rect x="660" y="752" width="60" height="12" rx="2" fill="#5487B5"/>
  <rect x="690" y="752" width="30" height="12" rx="2" fill="#C85A3A"/>
  <text x="726" y="762" class="param-desc">2</text>

  <!-- tower_ratio: 2 -->
  <text x="540" y="780" class="param-desc">tower_ratio</text>
  <rect x="660" y="770" width="60" height="12" rx="2" fill="#45d1b3"/>
  <rect x="690" y="770" width="30" height="12" rx="2" fill="#5487B5"/>
  <text x="726" y="780" class="param-desc">2</text>

  <!-- floors: 3 -->
  <text x="800" y="744" class="param-desc" fill="#C85A3A" font-weight="bold">floors</text>
  <rect x="910" y="734" width="90" height="12" rx="2" fill="#C85A3A"/>
  <rect x="940" y="734" width="30" height="12" rx="2" fill="#8A6BBF"/>
  <rect x="970" y="734" width="30" height="12" rx="2" fill="#45d1b3"/>
  <text x="1006" y="744" class="param-desc">3</text>

  <!-- wwRatio: 3 -->
  <text x="800" y="762" class="param-desc" fill="#C85A3A" font-weight="bold">wwRatio</text>
  <rect x="910" y="752" width="90" height="12" rx="2" fill="#D9A84A"/>
  <rect x="940" y="752" width="30" height="12" rx="2" fill="#C85A3A"/>
  <rect x="970" y="752" width="30" height="12" rx="2" fill="#45d1b3"/>
  <text x="1006" y="762" class="param-desc">3</text>

  <!-- windowType: 3 -->
  <text x="800" y="780" class="param-desc" fill="#C85A3A" font-weight="bold">windowType</text>
  <rect x="910" y="770" width="90" height="12" rx="2" fill="#D9A84A"/>
  <rect x="940" y="770" width="30" height="12" rx="2" fill="#C85A3A"/>
  <rect x="970" y="770" width="30" height="12" rx="2" fill="#45d1b3"/>
  <text x="1006" y="780" class="param-desc">3</text>

  <!-- sectionType: 3 -->
  <text x="800" y="798" class="param-desc" fill="#C85A3A" font-weight="bold">sectionType</text>
  <rect x="910" y="788" width="90" height="12" rx="2" fill="#45d1b3"/>
  <rect x="940" y="788" width="30" height="12" rx="2" fill="#5487B5"/>
  <rect x="970" y="788" width="30" height="12" rx="2" fill="#C85A3A"/>
  <text x="1006" y="798" class="param-desc">3</text>

  <!-- planType: 3 -->
  <text x="1070" y="744" class="param-desc" fill="#C85A3A" font-weight="bold">planType</text>
  <rect x="1170" y="734" width="90" height="12" rx="2" fill="#45d1b3"/>
  <rect x="1200" y="734" width="30" height="12" rx="2" fill="#D9A84A"/>
  <rect x="1230" y="734" width="30" height="12" rx="2" fill="#C85A3A"/>
  <text x="1266" y="744" class="param-desc">3</text>

  <!-- Insight arrow -->
  <text x="1070" y="780" class="param-desc" fill="#45d1b3" font-weight="bold">More agents = more negotiation</text>
  <line x1="1070" y1="786" x2="1260" y2="786" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="1258,782 1270,786 1258,790" fill="#45d1b3"/>

  <!-- Footer -->
  <text x="700" y="862" text-anchor="middle" class="param-desc" fill="rgba(138,130,118,0.5)">ArchSim V2 — Agent-Parameter Scope Map</text>

</svg>
