<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 22px; fill: #45d1b3; letter-spacing: 2px; }
      .subtitle { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 15px; fill: #8A8276; font-style: italic; }
      .agent-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .cat-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; font-weight: 700; fill: rgba(138,130,118,0.8); letter-spacing: 2px; }
      .param-name { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 15px; font-weight: 600; fill: #413C36; }
      .param-desc { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; fill: #8A8276; }
      .tension-title { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #E7E5D9; letter-spacing: 1px; }
      .tension-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; fill: #E7E5D9; }
      .tension-vs { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; fill: #C85A3A; font-weight: 700; }
      .bottom-note { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; fill: #E7E5D9; font-style: italic; text-anchor: middle; }
      .legend-dot-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; fill: #413C36; }
      .annotation { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; font-weight: 600; fill: rgba(138,130,118,0.7); letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#F5F3EA"/>

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" class="title">AGENT-PARAMETER SCOPE MAP</text>
  <text x="700" y="68" text-anchor="middle" class="subtitle">Overlapping scopes create design trade-off negotiations</text>

  <!-- ============================== -->
  <!-- LEFT COLUMN: Agent Labels      -->
  <!-- ============================== -->
  <rect x="40" y="100" width="210" height="38" rx="4" fill="#5487B5"/>
  <text x="145" y="124" text-anchor="middle" class="agent-label" fill="#FFFFFF">STRUCTURAL</text>

  <rect x="40" y="148" width="210" height="38" rx="4" fill="#D9A84A"/>
  <text x="145" y="172" text-anchor="middle" class="agent-label" fill="#FFFFFF">MEP</text>

  <rect x="40" y="196" width="210" height="38" rx="4" fill="#C85A3A"/>
  <text x="145" y="220" text-anchor="middle" class="agent-label" fill="#FFFFFF">COST</text>

  <rect x="40" y="244" width="210" height="38" rx="4" fill="#8A6BBF"/>
  <text x="145" y="268" text-anchor="middle" class="agent-label" fill="#FFFFFF">CODE</text>

  <rect x="40" y="292" width="210" height="38" rx="4" fill="#45d1b3"/>
  <text x="145" y="316" text-anchor="middle" class="agent-label" fill="#FFFFFF">ARCHITECT (HUMAN)</text>

  <!-- Legend -->
  <circle cx="60" cy="365" r="6" fill="#413C36"/>
  <text x="74" y="370" class="legend-dot-label">= Primary influence</text>
  <circle cx="60" cy="392" r="4" fill="#413C36" opacity="0.5"/>
  <text x="74" y="397" class="legend-dot-label">= Secondary influence</text>

  <!-- ============================== -->
  <!-- CENTER: Parameter Matrix       -->
  <!-- ============================== -->

  <!-- Column headers -->
  <circle cx="540" cy="115" r="6" fill="#5487B5"/>
  <circle cx="580" cy="115" r="6" fill="#D9A84A"/>
  <circle cx="620" cy="115" r="6" fill="#C85A3A"/>
  <circle cx="660" cy="115" r="6" fill="#8A6BBF"/>
  <circle cx="700" cy="115" r="6" fill="#45d1b3"/>
  <text x="540" y="100" text-anchor="middle" class="param-desc" fill="#5487B5" font-weight="700">S</text>
  <text x="580" y="100" text-anchor="middle" class="param-desc" fill="#D9A84A" font-weight="700">M</text>
  <text x="620" y="100" text-anchor="middle" class="param-desc" fill="#C85A3A" font-weight="700">Co</text>
  <text x="660" y="100" text-anchor="middle" class="param-desc" fill="#8A6BBF" font-weight="700">Cd</text>
  <text x="700" y="100" text-anchor="middle" class="param-desc" fill="#45d1b3" font-weight="700">A</text>

  <!-- Separator line -->
  <line x1="280" y1="128" x2="740" y2="128" stroke="rgba(65,60,54,0.15)" stroke-width="1"/>

  <!-- ======= GEOMETRY ======= -->
  <text x="290" y="155" class="cat-label">GEOMETRY</text>
  <line x1="280" y1="140" x2="740" y2="140" stroke="rgba(65,60,54,0.12)" stroke-width="1"/>

  <!-- floors (3 agents: Co+Cd+A) -->
  <rect x="282" y="160" width="466" height="24" rx="3" fill="rgba(69,209,179,0.08)"/>
  <text x="390" y="177" class="param-name">floors</text>
  <circle cx="620" cy="172" r="6" fill="#C85A3A"/>
  <circle cx="660" cy="172" r="4" fill="#8A6BBF" opacity="0.5"/>
  <circle cx="700" cy="172" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- floorplate (2 agents: Co+A) -->
  <text x="390" y="202" class="param-name">floorplate</text>
  <circle cx="620" cy="197" r="6" fill="#C85A3A"/>
  <circle cx="700" cy="197" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- base_shape (1 agent: A) -->
  <text x="390" y="227" class="param-name">base_shape</text>
  <circle cx="700" cy="222" r="6" fill="#45d1b3"/>

  <!-- orientation (2 agents: M+A) -->
  <text x="390" y="252" class="param-name">orientation</text>
  <circle cx="580" cy="247" r="6" fill="#D9A84A"/>
  <circle cx="700" cy="247" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- ======= STRUCTURE ======= -->
  <text x="290" y="283" class="cat-label">STRUCTURE</text>
  <line x1="280" y1="268" x2="740" y2="268" stroke="rgba(65,60,54,0.12)" stroke-width="1"/>

  <!-- structuralSpan (2 agents: S+Co) -->
  <text x="390" y="306" class="param-name">structuralSpan</text>
  <circle cx="540" cy="301" r="6" fill="#5487B5"/>
  <circle cx="620" cy="301" r="4" fill="#C85A3A" opacity="0.5"/>

  <!-- height (2 agents: S+Co) -->
  <text x="390" y="332" class="param-name">height</text>
  <circle cx="540" cy="327" r="6" fill="#5487B5"/>
  <circle cx="620" cy="327" r="4" fill="#C85A3A" opacity="0.5"/>

  <!-- floorHeight (derived - 2 agents: S+A) -->
  <text x="390" y="358" class="param-name">floorHeight <tspan font-size="11" fill="#8A8276">(derived)</tspan></text>
  <circle cx="540" cy="353" r="6" fill="#5487B5"/>
  <circle cx="700" cy="353" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- ======= ENVELOPE ======= -->
  <text x="290" y="389" class="cat-label">ENVELOPE</text>
  <line x1="280" y1="374" x2="740" y2="374" stroke="rgba(65,60,54,0.12)" stroke-width="1"/>

  <!-- wwRatio (3 agents: M+Co+A) -->
  <rect x="282" y="394" width="466" height="24" rx="3" fill="rgba(69,209,179,0.08)"/>
  <text x="390" y="412" class="param-name">wwRatio</text>
  <circle cx="580" cy="407" r="6" fill="#D9A84A"/>
  <circle cx="620" cy="407" r="4" fill="#C85A3A" opacity="0.5"/>
  <circle cx="700" cy="407" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- windowType (3 agents: M+Co+A) -->
  <text x="390" y="437" class="param-name">windowType</text>
  <circle cx="580" cy="432" r="6" fill="#D9A84A"/>
  <circle cx="620" cy="432" r="4" fill="#C85A3A" opacity="0.5"/>
  <circle cx="700" cy="432" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- ======= MASSING / PROGRAM ======= -->
  <text x="290" y="470" class="cat-label">MASSING / PROGRAM</text>
  <line x1="280" y1="455" x2="740" y2="455" stroke="rgba(65,60,54,0.12)" stroke-width="1"/>

  <!-- sectionType (3 agents: S+Co+A) -->
  <text x="390" y="494" class="param-name">sectionType</text>
  <circle cx="540" cy="489" r="4" fill="#5487B5" opacity="0.5"/>
  <circle cx="620" cy="489" r="4" fill="#C85A3A" opacity="0.5"/>
  <circle cx="700" cy="489" r="6" fill="#45d1b3"/>

  <!-- planType (3 agents: M+Co+A) -->
  <text x="390" y="520" class="param-name">planType</text>
  <circle cx="580" cy="515" r="4" fill="#D9A84A" opacity="0.5"/>
  <circle cx="620" cy="515" r="4" fill="#C85A3A" opacity="0.5"/>
  <circle cx="700" cy="515" r="6" fill="#45d1b3"/>

  <!-- buildingUse (3 agents: M+Cd+A) -->
  <rect x="282" y="532" width="466" height="24" rx="3" fill="rgba(69,209,179,0.08)"/>
  <text x="390" y="550" class="param-name">buildingUse</text>
  <circle cx="580" cy="544" r="4" fill="#D9A84A" opacity="0.5"/>
  <circle cx="660" cy="544" r="6" fill="#8A6BBF"/>
  <circle cx="700" cy="544" r="4" fill="#45d1b3" opacity="0.5"/>

  <!-- Bottom separator -->
  <line x1="280" y1="565" x2="740" y2="565" stroke="rgba(65,60,54,0.15)" stroke-width="1"/>

  <!-- Highlight legend -->
  <rect x="280" y="582" width="14" height="14" rx="2" fill="rgba(69,209,179,0.12)"/>
  <text x="300" y="594" class="legend-dot-label" font-size="12">= Tension zone (3 agents negotiate)</text>

  <!-- ============================== -->
  <!-- RIGHT: Tension Zones           -->
  <!-- ============================== -->
  <rect x="790" y="95" width="560" height="500" rx="8" fill="none" stroke="#45d1b3" stroke-width="2"/>
  <rect x="790" y="95" width="560" height="36" rx="8" fill="#45d1b3"/>
  <rect x="790" y="118" width="560" height="13" fill="#45d1b3"/>
  <text x="1070" y="119" text-anchor="middle" class="tension-title" fill="#F5F3EA">TENSION ZONES · where trade-offs emerge</text>

  <!-- Tension 1: floors -->
  <rect x="810" y="150" width="520" height="105" rx="6" fill="#413C36"/>
  <text x="830" y="175" class="param-name" font-size="15" fill="#E7E5D9">floors</text>
  <rect x="830" y="185" width="480" height="1" fill="rgba(231,229,217,0.15)"/>
  <circle cx="842" cy="208" r="5" fill="#C85A3A"/>
  <text x="855" y="212" class="tension-text" fill="#C85A3A" font-weight="700">Cost</text>
  <text x="905" y="212" class="tension-text">wants fewer floors (cheaper construction)</text>
  <text x="1070" y="236" text-anchor="middle" class="tension-vs">VS</text>
  <circle cx="842" cy="243" r="5" fill="#45d1b3"/>
  <text x="855" y="247" class="tension-text" fill="#45d1b3" font-weight="700">Architect</text>
  <text x="925" y="247" class="tension-text">wants more floors (maximize GFA)</text>

  <!-- Tension 2: wwRatio -->
  <rect x="810" y="270" width="520" height="105" rx="6" fill="#413C36"/>
  <text x="830" y="295" class="param-name" font-size="15" fill="#E7E5D9">wwRatio</text>
  <rect x="830" y="305" width="480" height="1" fill="rgba(231,229,217,0.15)"/>
  <circle cx="842" cy="328" r="5" fill="#D9A84A"/>
  <text x="855" y="332" class="tension-text" fill="#D9A84A" font-weight="700">MEP</text>
  <text x="895" y="332" class="tension-text">wants less glazing (reduce energy load)</text>
  <text x="1070" y="356" text-anchor="middle" class="tension-vs">VS</text>
  <circle cx="842" cy="363" r="5" fill="#45d1b3"/>
  <text x="855" y="367" class="tension-text" fill="#45d1b3" font-weight="700">Architect</text>
  <text x="925" y="367" class="tension-text">wants more glazing (views + daylight)</text>

  <!-- Tension 3: structuralSpan -->
  <rect x="810" y="390" width="520" height="105" rx="6" fill="#413C36"/>
  <text x="830" y="415" class="param-name" font-size="15" fill="#E7E5D9">structuralSpan</text>
  <rect x="830" y="425" width="480" height="1" fill="rgba(231,229,217,0.15)"/>
  <circle cx="842" cy="448" r="5" fill="#5487B5"/>
  <text x="855" y="452" class="tension-text" fill="#5487B5" font-weight="700">Structural</text>
  <text x="925" y="452" class="tension-text">wants smaller spans (safer, efficient)</text>
  <text x="1070" y="476" text-anchor="middle" class="tension-vs">VS</text>
  <circle cx="842" cy="483" r="5" fill="#45d1b3"/>
  <text x="855" y="487" class="tension-text" fill="#45d1b3" font-weight="700">Architect</text>
  <text x="925" y="487" class="tension-text">wants larger spans (open plan flexibility)</text>

  <!-- Tension 4: buildingUse -->
  <rect x="810" y="510" width="520" height="70" rx="6" fill="#413C36"/>
  <text x="830" y="535" class="param-name" font-size="15" fill="#E7E5D9">buildingUse</text>
  <rect x="830" y="544" width="480" height="1" fill="rgba(231,229,217,0.15)"/>
  <text x="830" y="566" class="tension-text" font-size="13">Reshapes code classification, HVAC sizing,</text>
  <text x="830" y="582" class="tension-text" font-size="13">cost per m², and program — 3 agents all weigh in</text>

  <!-- ============================== -->
  <!-- BOTTOM: Summary Insight        -->
  <!-- ============================== -->
  <rect x="100" y="620" width="1200" height="55" rx="8" fill="#413C36"/>
  <text x="700" y="645" class="bottom-note">Parameters with multiple agents = negotiation points where trade-offs emerge.</text>
  <text x="700" y="665" class="bottom-note">Single-agent parameters = expert recommendations accepted directly.</text>

  <!-- ============================== -->
  <!-- Overlap Density Bar Chart      -->
  <!-- ============================== -->
  <text x="100" y="713" class="cat-label">OVERLAP DENSITY · 1, 2, OR 3 AGENTS PER PARAMETER</text>

  <!-- Row 1 (1 agent): base_shape -->
  <text x="100" y="745" class="param-desc" fill="#413C36">base_shape</text>
  <rect x="240" y="735" width="30" height="14" rx="2" fill="#45d1b3"/>
  <text x="280" y="745" class="param-desc" fill="#413C36">1</text>

  <!-- Row 2 (2 agents): floorplate, orientation, structuralSpan, height, floorHeight -->
  <text x="100" y="772" class="param-desc" fill="#413C36">floorplate</text>
  <rect x="240" y="762" width="30" height="14" rx="2" fill="#C85A3A"/>
  <rect x="270" y="762" width="30" height="14" rx="2" fill="#45d1b3"/>
  <text x="310" y="772" class="param-desc" fill="#413C36">2</text>

  <text x="360" y="772" class="param-desc" fill="#413C36">orientation</text>
  <rect x="500" y="762" width="30" height="14" rx="2" fill="#D9A84A"/>
  <rect x="530" y="762" width="30" height="14" rx="2" fill="#45d1b3"/>
  <text x="570" y="772" class="param-desc" fill="#413C36">2</text>

  <text x="620" y="772" class="param-desc" fill="#413C36">structuralSpan</text>
  <rect x="760" y="762" width="30" height="14" rx="2" fill="#5487B5"/>
  <rect x="790" y="762" width="30" height="14" rx="2" fill="#C85A3A"/>
  <text x="830" y="772" class="param-desc" fill="#413C36">2</text>

  <text x="880" y="772" class="param-desc" fill="#413C36">height</text>
  <rect x="1000" y="762" width="30" height="14" rx="2" fill="#5487B5"/>
  <rect x="1030" y="762" width="30" height="14" rx="2" fill="#C85A3A"/>
  <text x="1070" y="772" class="param-desc" fill="#413C36">2</text>

  <text x="1120" y="772" class="param-desc" fill="#413C36">floorHeight</text>
  <rect x="1250" y="762" width="30" height="14" rx="2" fill="#5487B5"/>
  <rect x="1280" y="762" width="30" height="14" rx="2" fill="#45d1b3"/>
  <text x="1320" y="772" class="param-desc" fill="#413C36">2</text>

  <!-- Row 3 (3 agents): floors, wwRatio, windowType, sectionType, planType, buildingUse -->
  <text x="100" y="799" class="param-desc" fill="#C85A3A" font-weight="700">floors</text>
  <rect x="240" y="789" width="30" height="14" rx="2" fill="#C85A3A"/>
  <rect x="270" y="789" width="30" height="14" rx="2" fill="#8A6BBF"/>
  <rect x="300" y="789" width="30" height="14" rx="2" fill="#45d1b3"/>
  <text x="340" y="799" class="param-desc" fill="#413C36">3</text>

  <text x="380" y="799" class="param-desc" fill="#C85A3A" font-weight="700">wwRatio</text>
  <rect x="500" y="789" width="30" height="14" rx="2" fill="#D9A84A"/>
  <rect x="530" y="789" width="30" height="14" rx="2" fill="#C85A3A"/>
  <rect x="560" y="789" width="30" height="14" rx="2" fill="#45d1b3"/>
  <text x="600" y="799" class="param-desc" fill="#413C36">3</text>

  <text x="640" y="799" class="param-desc" fill="#C85A3A" font-weight="700">windowType</text>
  <rect x="760" y="789" width="30" height="14" rx="2" fill="#D9A84A"/>
  <rect x="790" y="789" width="30" height="14" rx="2" fill="#C85A3A"/>
  <rect x="820" y="789" width="30" height="14" rx="2" fill="#45d1b3"/>
  <text x="860" y="799" class="param-desc" fill="#413C36">3</text>

  <text x="900" y="799" class="param-desc" fill="#C85A3A" font-weight="700">sectionType</text>
  <rect x="1000" y="789" width="30" height="14" rx="2" fill="#45d1b3"/>
  <rect x="1030" y="789" width="30" height="14" rx="2" fill="#5487B5"/>
  <rect x="1060" y="789" width="30" height="14" rx="2" fill="#C85A3A"/>
  <text x="1100" y="799" class="param-desc" fill="#413C36">3</text>

  <text x="1140" y="799" class="param-desc" fill="#C85A3A" font-weight="700">planType</text>
  <rect x="1250" y="789" width="30" height="14" rx="2" fill="#45d1b3"/>
  <rect x="1280" y="789" width="30" height="14" rx="2" fill="#D9A84A"/>
  <rect x="1310" y="789" width="30" height="14" rx="2" fill="#C85A3A"/>
  <text x="1350" y="799" class="param-desc" fill="#413C36">3</text>

  <text x="100" y="826" class="param-desc" fill="#C85A3A" font-weight="700">buildingUse</text>
  <rect x="240" y="816" width="30" height="14" rx="2" fill="#D9A84A"/>
  <rect x="270" y="816" width="30" height="14" rx="2" fill="#8A6BBF"/>
  <rect x="300" y="816" width="30" height="14" rx="2" fill="#45d1b3"/>
  <text x="340" y="826" class="param-desc" fill="#413C36">3</text>

  <!-- Insight -->
  <text x="500" y="826" class="param-desc" fill="#45d1b3" font-weight="700">More agents = more negotiation →</text>
  <line x1="820" y1="821" x2="1000" y2="821" stroke="#45d1b3" stroke-width="1.5"/>
  <polygon points="998,817 1012,821 998,825" fill="#45d1b3"/>

  <!-- Annotation -->
  <text x="100" y="875" class="annotation">SCOPE MAP · 12 REAL PARAMETERS FROM ARCHSIM</text>
</svg>
