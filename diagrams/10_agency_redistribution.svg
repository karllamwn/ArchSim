<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .main-title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 18px; fill: #45d1b3; letter-spacing: 2px; }
      .section-title { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 12px; letter-spacing: 1px; }
      .box-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; fill: #E7E5D9; }
      .box-desc { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 19px; fill: #8A8276; }
      .flow-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 17px; fill: #8A8276; }
      .annotation { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 8px; fill: rgba(138,130,118,0.5); letter-spacing: 3px; }
      .vs-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; fill: #C85A3A; }
      .insight { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 20px; fill: #E7E5D9; }
      .insight-accent { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 20px; fill: #45d1b3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="850" fill="#F5F3EA" />

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" class="main-title">AGENCY REDISTRIBUTION</text>
  <text x="700" y="72" text-anchor="middle" class="annotation">TRADITIONAL WORKFLOW VS ARCHSIM</text>

  <!-- Divider line -->
  <line x1="700" y1="95" x2="700" y2="700" stroke="rgba(65,60,54,0.15)" stroke-width="1" stroke-dasharray="8,4" />

  <!-- ====== LEFT: TRADITIONAL ====== -->
  <text x="350" y="110" text-anchor="middle" class="section-title" fill="rgba(138,130,118,0.5)">TRADITIONAL</text>

  <!-- Architect (top) -->
  <rect x="260" y="140" width="180" height="55" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="350" y="165" text-anchor="middle" class="box-label">ARCHITECT</text>
  <text x="350" y="185" text-anchor="middle" class="box-desc">Draws, decides</text>

  <!-- Arrow down -->
  <line x1="350" y1="195" x2="350" y2="235" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="344,237 350,250 356,237" fill="#8A8276" />
  <text x="380" y="222" class="flow-label">sends drawings</text>

  <!-- Structural Consultant -->
  <rect x="170" y="255" width="150" height="45" rx="5" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="245" y="283" text-anchor="middle" class="box-label" font-size="8">STRUCTURAL</text>

  <!-- MEP Consultant -->
  <rect x="370" y="255" width="150" height="45" rx="5" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="445" y="283" text-anchor="middle" class="box-label" font-size="8">MEP</text>

  <!-- Arrows down from consultants -->
  <line x1="245" y1="300" x2="245" y2="330" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="239,332 245,345 251,332" fill="#8A8276" />
  <line x1="445" y1="300" x2="445" y2="330" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="439,332 445,345 451,332" fill="#8A8276" />
  <text x="350" y="325" text-anchor="middle" class="flow-label">redlines back</text>

  <!-- Architect revises -->
  <rect x="260" y="350" width="180" height="45" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="350" y="373" text-anchor="middle" class="box-label" font-size="8">ARCHITECT REVISES</text>
  <text x="350" y="390" text-anchor="middle" class="box-desc">Manually updates</text>

  <!-- Arrow down -->
  <line x1="350" y1="395" x2="350" y2="425" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="344,427 350,440 356,427" fill="#8A8276" />

  <!-- Cost -->
  <rect x="260" y="445" width="180" height="45" rx="5" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="350" y="473" text-anchor="middle" class="box-label" font-size="8">COST ESTIMATE</text>

  <!-- Arrow down -->
  <line x1="350" y1="490" x2="350" y2="520" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="344,522 350,535 356,522" fill="#8A8276" />

  <!-- Architect revises again -->
  <rect x="260" y="540" width="180" height="45" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="350" y="563" text-anchor="middle" class="box-label" font-size="8">REVISE AGAIN</text>
  <text x="350" y="580" text-anchor="middle" class="box-desc">Weeks of iteration</text>

  <!-- Characteristics -->
  <text x="350" y="630" text-anchor="middle" class="flow-label">Linear, sequential</text>
  <text x="350" y="652" text-anchor="middle" class="flow-label">Weeks per feedback loop</text>
  <text x="350" y="674" text-anchor="middle" class="flow-label">Architect is sole author</text>
  <text x="350" y="696" text-anchor="middle" class="flow-label">Consultants react, not propose</text>

  <!-- ====== VS ====== -->
  <text x="700" y="420" text-anchor="middle" class="vs-text">VS</text>

  <!-- ====== RIGHT: ARCHSIM ====== -->
  <text x="1050" y="110" text-anchor="middle" class="section-title" fill="#45d1b3">ARCHSIM</text>

  <!-- Center hub: Design Parameters -->
  <rect x="975" y="300" width="150" height="55" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5" />
  <text x="1050" y="322" text-anchor="middle" class="box-label" font-size="8">DESIGN</text>
  <text x="1050" y="340" text-anchor="middle" class="box-label" font-size="8">PARAMETERS</text>

  <!-- Architect (top) -->
  <rect x="975" y="140" width="150" height="50" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="1.5" />
  <text x="1050" y="165" text-anchor="middle" class="box-label" style="fill:#45d1b3">ARCHITECT</text>
  <text x="1050" y="182" text-anchor="middle" class="box-desc">Decides + overrides</text>

  <!-- Structural (left) -->
  <rect x="800" y="220" width="120" height="45" rx="5" fill="#413C36" stroke="#5487B5" stroke-width="1" />
  <text x="860" y="248" text-anchor="middle" class="box-label" font-size="7" style="fill:#5487B5">STRUCTURAL</text>

  <!-- MEP (right) -->
  <rect x="1180" y="220" width="120" height="45" rx="5" fill="#413C36" stroke="#D9A84A" stroke-width="1" />
  <text x="1240" y="248" text-anchor="middle" class="box-label" font-size="7" style="fill:#D9A84A">MEP</text>

  <!-- Cost (left-bottom) -->
  <rect x="800" y="390" width="120" height="45" rx="5" fill="#413C36" stroke="#C85A3A" stroke-width="1" />
  <text x="860" y="418" text-anchor="middle" class="box-label" font-size="7" style="fill:#C85A3A">COST</text>

  <!-- Code (right-bottom) -->
  <rect x="1180" y="390" width="120" height="45" rx="5" fill="#413C36" stroke="#8A6BBF" stroke-width="1" />
  <text x="1240" y="418" text-anchor="middle" class="box-label" font-size="7" style="fill:#8A6BBF">CODE</text>

  <!-- GH (bottom center) -->
  <rect x="975" y="475" width="150" height="45" rx="5" fill="#413C36" stroke="#45d1b3" stroke-width="1" />
  <text x="1050" y="503" text-anchor="middle" class="box-label" font-size="8" style="fill:#45d1b3">GRASSHOPPER</text>

  <!-- Bi-directional connections: Architect ↔ Params -->
  <line x1="1050" y1="190" x2="1050" y2="298" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="1044,296 1050,309 1056,296" fill="#45d1b3" />
  <polygon points="1044,192 1050,179 1056,192" fill="#45d1b3" />

  <!-- Structural ↔ Params -->
  <line x1="920" y1="250" x2="973" y2="310" stroke="#5487B5" stroke-width="1" />
  <polygon points="969,306 980,316 976,302" fill="#5487B5" />

  <!-- MEP ↔ Params -->
  <line x1="1180" y1="250" x2="1127" y2="310" stroke="#D9A84A" stroke-width="1" />
  <polygon points="1131,306 1120,316 1124,302" fill="#D9A84A" />

  <!-- Cost ↔ Params -->
  <line x1="920" y1="405" x2="973" y2="345" stroke="#C85A3A" stroke-width="1" />
  <polygon points="969,349 980,339 976,353" fill="#C85A3A" />

  <!-- Code ↔ Params -->
  <line x1="1180" y1="405" x2="1127" y2="345" stroke="#8A6BBF" stroke-width="1" />
  <polygon points="1131,349 1120,339 1124,353" fill="#8A6BBF" />

  <!-- Params ↔ GH -->
  <line x1="1050" y1="357" x2="1050" y2="473" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="1044,471 1050,484 1056,471" fill="#45d1b3" />
  <polygon points="1044,359 1050,346 1056,359" fill="#45d1b3" />

  <!-- Characteristics -->
  <text x="1050" y="560" text-anchor="middle" class="flow-label">Networked, simultaneous</text>
  <text x="1050" y="582" text-anchor="middle" class="flow-label">Minutes per feedback loop</text>
  <text x="1050" y="604" text-anchor="middle" class="flow-label">Architect is decision-maker</text>
  <text x="1050" y="626" text-anchor="middle" class="flow-label">Agents propose + negotiate</text>

  <!-- Bottom insight bar -->
  <rect x="100" y="730" width="1200" height="50" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="700" y="752" text-anchor="middle" class="insight">Authorship shifts from</text>
  <text x="700" y="774" text-anchor="middle" class="insight-accent">sole creator  →  informed decision-maker within a negotiation network</text>

  <!-- Annotation -->
  <text x="100" y="820" class="annotation">WORKFLOW COMPARISON</text>
</svg>
