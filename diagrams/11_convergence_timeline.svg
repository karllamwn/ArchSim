<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" width="1400" height="750">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .main-title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 18px; fill: #45d1b3; letter-spacing: 2px; }
      .round-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; fill: #45d1b3; }
      .param-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 8px; letter-spacing: 1px; }
      .value-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 20px; fill: #E7E5D9; }
      .agent-tag { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 16px; }
      .annotation { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 8px; fill: rgba(138,130,118,0.5); letter-spacing: 3px; }
      .insight { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 19px; fill: #E7E5D9; }
      .converge-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; fill: #45d1b3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="750" fill="#F5F3EA" />

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" class="main-title">CONVERGENCE TIMELINE</text>
  <text x="700" y="67" text-anchor="middle" class="annotation">PARAMETER NEGOTIATION ACROSS ROUNDS</text>

  <!-- Round columns -->
  <text x="240" y="110" text-anchor="middle" class="round-label">ROUND 1</text>
  <text x="540" y="110" text-anchor="middle" class="round-label">ROUND 2</text>
  <text x="840" y="110" text-anchor="middle" class="round-label">ROUND 3</text>
  <text x="1140" y="110" text-anchor="middle" class="round-label">CONVERGED</text>

  <!-- Vertical separators -->
  <line x1="400" y1="95" x2="400" y2="600" stroke="rgba(65,60,54,0.12)" stroke-width="1" stroke-dasharray="6,4" />
  <line x1="700" y1="95" x2="700" y2="600" stroke="rgba(65,60,54,0.12)" stroke-width="1" stroke-dasharray="6,4" />
  <line x1="1000" y1="95" x2="1000" y2="600" stroke="rgba(65,60,54,0.12)" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Converged column highlight -->
  <rect x="1000" y="95" width="280" height="505" rx="6" fill="rgba(69,209,179,0.06)" />

  <!-- ====== ROW 1: WWR (Window-Wall Ratio) ====== -->
  <text x="80" y="175" class="param-label" fill="#D9A84A">WWR</text>

  <!-- R1: 0.60 -->
  <rect x="180" y="150" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="240" y="177" text-anchor="middle" class="value-text">0.60</text>
  <text x="240" y="205" text-anchor="middle" class="agent-tag" fill="#D9A84A">MEP: too high</text>

  <!-- Arrow R1→R2 -->
  <line x1="302" y1="170" x2="475" y2="170" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="477,164 490,170 477,176" fill="#8A8276" />

  <!-- R2: 0.48 -->
  <rect x="480" y="150" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="540" y="177" text-anchor="middle" class="value-text">0.48</text>
  <text x="540" y="205" text-anchor="middle" class="agent-tag" fill="#C85A3A">Cost: still high</text>

  <!-- Arrow R2→R3 -->
  <line x1="602" y1="170" x2="775" y2="170" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="777,164 790,170 777,176" fill="#8A8276" />

  <!-- R3: 0.42 -->
  <rect x="780" y="150" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="840" y="177" text-anchor="middle" class="value-text">0.42</text>
  <text x="840" y="205" text-anchor="middle" class="agent-tag" fill="#8A8276">All agree</text>

  <!-- Arrow R3→Converged -->
  <line x1="902" y1="170" x2="1075" y2="170" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="1077,164 1090,170 1077,176" fill="#45d1b3" />

  <!-- Converged -->
  <rect x="1080" y="150" width="120" height="40" rx="4" fill="#413C36" stroke="#45d1b3" stroke-width="1.5" />
  <text x="1140" y="177" text-anchor="middle" class="value-text" fill="#45d1b3">0.42</text>

  <!-- ====== ROW 2: Structural Span ====== -->
  <text x="80" y="295" class="param-label" fill="#5487B5">SPAN</text>

  <!-- R1: 12m -->
  <rect x="180" y="270" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="240" y="297" text-anchor="middle" class="value-text">12m</text>
  <text x="240" y="325" text-anchor="middle" class="agent-tag" fill="#5487B5">Struct: reduce</text>

  <!-- Arrow -->
  <line x1="302" y1="290" x2="475" y2="290" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="477,284 490,290 477,296" fill="#8A8276" />

  <!-- R2: 9m -->
  <rect x="480" y="270" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="540" y="297" text-anchor="middle" class="value-text">9m</text>
  <text x="540" y="325" text-anchor="middle" class="agent-tag" fill="#45d1b3">Arch: OK</text>

  <!-- Arrow -->
  <line x1="602" y1="290" x2="775" y2="290" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="777,284 790,290 777,296" fill="#8A8276" />

  <!-- R3: 9m -->
  <rect x="780" y="270" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="840" y="297" text-anchor="middle" class="value-text">9m</text>
  <text x="840" y="325" text-anchor="middle" class="agent-tag" fill="#8A8276">Stable</text>

  <!-- Arrow -->
  <line x1="902" y1="290" x2="1075" y2="290" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="1077,284 1090,290 1077,296" fill="#45d1b3" />

  <!-- Converged -->
  <rect x="1080" y="270" width="120" height="40" rx="4" fill="#413C36" stroke="#45d1b3" stroke-width="1.5" />
  <text x="1140" y="297" text-anchor="middle" class="value-text" fill="#45d1b3">9m</text>

  <!-- ====== ROW 3: Floors ====== -->
  <text x="80" y="415" class="param-label" fill="#C85A3A">FLOORS</text>

  <!-- R1: 16 -->
  <rect x="180" y="390" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="240" y="417" text-anchor="middle" class="value-text">16</text>
  <text x="240" y="445" text-anchor="middle" class="agent-tag" fill="#C85A3A">Cost: reduce</text>

  <!-- Arrow -->
  <line x1="302" y1="410" x2="475" y2="410" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="477,404 490,410 477,416" fill="#8A8276" />

  <!-- R2: 14 -->
  <rect x="480" y="390" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="540" y="417" text-anchor="middle" class="value-text">14</text>
  <text x="540" y="445" text-anchor="middle" class="agent-tag" fill="#8A6BBF">Code: FSR limit</text>

  <!-- Arrow -->
  <line x1="602" y1="410" x2="775" y2="410" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="777,404 790,410 777,416" fill="#8A8276" />

  <!-- R3: 12 -->
  <rect x="780" y="390" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="840" y="417" text-anchor="middle" class="value-text">12</text>
  <text x="840" y="445" text-anchor="middle" class="agent-tag" fill="#8A8276">All agree</text>

  <!-- Arrow -->
  <line x1="902" y1="410" x2="1075" y2="410" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="1077,404 1090,410 1077,416" fill="#45d1b3" />

  <!-- Converged -->
  <rect x="1080" y="390" width="120" height="40" rx="4" fill="#413C36" stroke="#45d1b3" stroke-width="1.5" />
  <text x="1140" y="417" text-anchor="middle" class="value-text" fill="#45d1b3">12</text>

  <!-- ====== ROW 4: Orientation ====== -->
  <text x="80" y="535" class="param-label" fill="#D9A84A">ORIENT</text>

  <!-- R1: 0 (N) -->
  <rect x="180" y="510" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="240" y="537" text-anchor="middle" class="value-text">0 (N)</text>
  <text x="240" y="565" text-anchor="middle" class="agent-tag" fill="#D9A84A">MEP: rotate</text>

  <!-- Arrow -->
  <line x1="302" y1="530" x2="475" y2="530" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="477,524 490,530 477,536" fill="#8A8276" />

  <!-- R2: 15 -->
  <rect x="480" y="510" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="540" y="537" text-anchor="middle" class="value-text">15 (NNE)</text>
  <text x="540" y="565" text-anchor="middle" class="agent-tag" fill="#45d1b3">Arch: accept</text>

  <!-- Arrow -->
  <line x1="602" y1="530" x2="775" y2="530" stroke="#8A8276" stroke-width="1.5" />
  <polygon points="777,524 790,530 777,536" fill="#8A8276" />

  <!-- R3: 15 -->
  <rect x="780" y="510" width="120" height="40" rx="4" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="840" y="537" text-anchor="middle" class="value-text">15</text>
  <text x="840" y="565" text-anchor="middle" class="agent-tag" fill="#8A8276">Stable</text>

  <!-- Arrow -->
  <line x1="902" y1="530" x2="1075" y2="530" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="1077,524 1090,530 1077,536" fill="#45d1b3" />

  <!-- Converged -->
  <rect x="1080" y="510" width="120" height="40" rx="4" fill="#413C36" stroke="#45d1b3" stroke-width="1.5" />
  <text x="1140" y="537" text-anchor="middle" class="value-text" fill="#45d1b3">15</text>

  <!-- Convergence indicator -->
  <text x="1140" y="595" text-anchor="middle" class="converge-label">CONSENSUS</text>

  <!-- Bottom insight -->
  <rect x="100" y="640" width="1200" height="45" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="700" y="668" text-anchor="middle" class="insight">Trade-offs are visible: each round shows <tspan fill="#45d1b3">who proposed what</tspan> and <tspan fill="#C85A3A">why values changed</tspan></text>

  <!-- Annotation -->
  <text x="100" y="725" class="annotation">MULTI-ROUND NEGOTIATION</text>
</svg>
