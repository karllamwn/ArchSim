<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .main-title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 22px; fill: #45d1b3; letter-spacing: 2px; }
      .subtitle { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 15px; font-weight: 400; fill: #8A8276; }
      .phase-num { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
      .phase-name { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; font-weight: 600; fill: #E7E5D9; }
      .phase-name-primary { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 15px; font-weight: 700; fill: #E7E5D9; }
      .fit-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; font-weight: 600; }
      .fit-note { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 10px; font-weight: 400; fill: #8A8276; }
      .quote { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 17px; font-style: italic; fill: #413C36; }
      .annotation { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; font-weight: 600; fill: rgba(138,130,118,0.7); letter-spacing: 3px; }
      .key-insight { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 18px; font-weight: 400; fill: #E7E5D9; }
      .key-insight-accent { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 18px; font-weight: 600; fill: #45d1b3; }
      .trend-note { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; font-weight: 400; fill: #413C36; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="820" fill="#F5F3EA" />

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" class="main-title">SCOPE IN THE RAIC DESIGN PROCESS</text>
  <text x="700" y="75" text-anchor="middle" class="annotation">7 PHASES · CANADIAN HANDBOOK OF PRACTICE · 3RD EDITION</text>
  <text x="700" y="105" text-anchor="middle" class="subtitle">ArchSim is scoped to Schematic Design — where competing disciplinary requirements are first synthesized</text>

  <!-- ====== Scope Indicator Bars (above phases) ====== -->
  <!-- Primary scope: SD -->
  <rect x="235" y="160" width="190" height="10" rx="3" fill="#45d1b3" />
  <text x="330" y="152" text-anchor="middle" class="fit-label" fill="#45d1b3">★ PRIMARY FIT</text>

  <!-- Partial scope: Predesign + Early DD -->
  <rect x="50" y="163" width="170" height="5" rx="2" fill="rgba(69,209,179,0.4)" />
  <text x="135" y="152" text-anchor="middle" class="fit-label" fill="rgba(69,209,179,0.7)" font-size="10">partial</text>

  <rect x="440" y="163" width="170" height="5" rx="2" fill="rgba(69,209,179,0.4)" />
  <text x="525" y="152" text-anchor="middle" class="fit-label" fill="rgba(69,209,179,0.7)" font-size="10">partial</text>

  <!-- ====== 7 Phase Boxes ====== -->
  <!-- 6.1 Predesign -->
  <rect x="50" y="180" width="170" height="140" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="135" y="208" text-anchor="middle" class="phase-num" fill="#8A8276">6.1</text>
  <line x1="70" y1="220" x2="200" y2="220" stroke="rgba(231,229,217,0.15)" stroke-width="1" />
  <text x="135" y="248" text-anchor="middle" class="phase-name">Predesign</text>
  <text x="135" y="285" text-anchor="middle" class="fit-label" fill="rgba(69,209,179,0.85)">◐ PARTIAL</text>
  <text x="135" y="305" text-anchor="middle" class="fit-note">Brief parsing</text>

  <!-- 6.2 Schematic Design (PRIMARY) -->
  <rect x="235" y="172" width="190" height="156" rx="6" fill="#413C36" stroke="#45d1b3" stroke-width="2.5" />
  <text x="330" y="202" text-anchor="middle" class="phase-num" fill="#45d1b3">6.2 ★</text>
  <line x1="255" y1="214" x2="405" y2="214" stroke="rgba(69,209,179,0.3)" stroke-width="1" />
  <text x="330" y="244" text-anchor="middle" class="phase-name-primary">Schematic</text>
  <text x="330" y="266" text-anchor="middle" class="phase-name-primary">Design</text>
  <text x="330" y="294" text-anchor="middle" class="fit-label" fill="#45d1b3">✓ PRIMARY FIT</text>
  <text x="330" y="314" text-anchor="middle" class="fit-note" fill="#45d1b3">Full coverage</text>

  <!-- 6.3 Design Development -->
  <rect x="440" y="180" width="170" height="140" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="525" y="208" text-anchor="middle" class="phase-num" fill="#8A8276">6.3</text>
  <line x1="460" y1="220" x2="590" y2="220" stroke="rgba(231,229,217,0.15)" stroke-width="1" />
  <text x="525" y="243" text-anchor="middle" class="phase-name">Design</text>
  <text x="525" y="262" text-anchor="middle" class="phase-name">Development</text>
  <text x="525" y="285" text-anchor="middle" class="fit-label" fill="rgba(69,209,179,0.85)">◐ PARTIAL</text>
  <text x="525" y="305" text-anchor="middle" class="fit-note">Early only</text>

  <!-- 6.4 Construction Documents -->
  <rect x="625" y="180" width="170" height="140" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.15)" stroke-width="1" opacity="0.55" />
  <text x="710" y="208" text-anchor="middle" class="phase-num" fill="rgba(138,130,118,0.7)">6.4</text>
  <line x1="645" y1="220" x2="775" y2="220" stroke="rgba(231,229,217,0.1)" stroke-width="1" />
  <text x="710" y="243" text-anchor="middle" class="phase-name" fill="rgba(231,229,217,0.5)">Construction</text>
  <text x="710" y="262" text-anchor="middle" class="phase-name" fill="rgba(231,229,217,0.5)">Documents</text>
  <text x="710" y="285" text-anchor="middle" class="fit-label" fill="rgba(200,90,58,0.6)">✗ OUT OF SCOPE</text>

  <!-- 6.5 Procurement -->
  <rect x="810" y="180" width="170" height="140" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.15)" stroke-width="1" opacity="0.55" />
  <text x="895" y="208" text-anchor="middle" class="phase-num" fill="rgba(138,130,118,0.7)">6.5</text>
  <line x1="830" y1="220" x2="960" y2="220" stroke="rgba(231,229,217,0.1)" stroke-width="1" />
  <text x="895" y="243" text-anchor="middle" class="phase-name" fill="rgba(231,229,217,0.5)">Construction</text>
  <text x="895" y="262" text-anchor="middle" class="phase-name" fill="rgba(231,229,217,0.5)">Procurement</text>
  <text x="895" y="285" text-anchor="middle" class="fit-label" fill="rgba(200,90,58,0.6)">✗ OUT OF SCOPE</text>

  <!-- 6.6 CCA -->
  <rect x="995" y="180" width="170" height="140" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.15)" stroke-width="1" opacity="0.55" />
  <text x="1080" y="208" text-anchor="middle" class="phase-num" fill="rgba(138,130,118,0.7)">6.6</text>
  <line x1="1015" y1="220" x2="1145" y2="220" stroke="rgba(231,229,217,0.1)" stroke-width="1" />
  <text x="1080" y="243" text-anchor="middle" class="phase-name" fill="rgba(231,229,217,0.5)">Contract</text>
  <text x="1080" y="262" text-anchor="middle" class="phase-name" fill="rgba(231,229,217,0.5)">Administration</text>
  <text x="1080" y="285" text-anchor="middle" class="fit-label" fill="rgba(200,90,58,0.6)">✗ OUT OF SCOPE</text>

  <!-- 6.7 Commissioning -->
  <rect x="1180" y="180" width="170" height="140" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.15)" stroke-width="1" opacity="0.55" />
  <text x="1265" y="208" text-anchor="middle" class="phase-num" fill="rgba(138,130,118,0.7)">6.7</text>
  <line x1="1200" y1="220" x2="1330" y2="220" stroke="rgba(231,229,217,0.1)" stroke-width="1" />
  <text x="1265" y="243" text-anchor="middle" class="phase-name" fill="rgba(231,229,217,0.5)">Commissioning</text>
  <text x="1265" y="262" text-anchor="middle" class="phase-name" fill="rgba(231,229,217,0.5)">+ POE</text>
  <text x="1265" y="285" text-anchor="middle" class="fit-label" fill="rgba(200,90,58,0.6)">✗ OUT OF SCOPE</text>

  <!-- ====== Small arrows between phases ====== -->
  <g stroke="rgba(138,130,118,0.4)" stroke-width="1" fill="none">
    <line x1="222" y1="250" x2="232" y2="250" />
    <line x1="427" y1="250" x2="437" y2="250" />
    <line x1="612" y1="250" x2="622" y2="250" />
    <line x1="797" y1="250" x2="807" y2="250" />
    <line x1="982" y1="250" x2="992" y2="250" />
    <line x1="1167" y1="250" x2="1177" y2="250" />
  </g>
  <g fill="rgba(138,130,118,0.6)">
    <polygon points="232,246 238,250 232,254" />
    <polygon points="437,246 443,250 437,254" />
    <polygon points="622,246 628,250 622,254" />
    <polygon points="807,246 813,250 807,254" />
    <polygon points="992,246 998,250 992,254" />
    <polygon points="1177,246 1183,250 1177,254" />
  </g>

  <!-- ====== RAIC Quote Block ====== -->
  <rect x="100" y="380" width="1200" height="105" rx="6" fill="rgba(69,209,179,0.06)" stroke="rgba(69,209,179,0.3)" stroke-width="1" />
  <text x="700" y="418" text-anchor="middle" class="quote">"The purpose of the schematic design phase is to resolve pre-design investigations</text>
  <text x="700" y="443" text-anchor="middle" class="quote">into a concept of 'what will be built' — synthesizing various, often competing</text>
  <text x="700" y="468" text-anchor="middle" class="quote">requirements into an architectural expression."</text>

  <text x="700" y="507" text-anchor="middle" class="annotation">— RAIC CANADIAN HANDBOOK OF PRACTICE · CHAPTER 6.2</text>

  <!-- ====== Key Insight Band ====== -->
  <rect x="100" y="540" width="1200" height="70" rx="6" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="700" y="572" text-anchor="middle" class="key-insight">Schematic Design is where <tspan fill="#45d1b3">competing disciplinary requirements</tspan> are first synthesized —</text>
  <text x="700" y="595" text-anchor="middle" class="key-insight">which is exactly what a <tspan fill="#45d1b3">data-grounded multi-agent negotiation</tspan> does.</text>

  <!-- ====== "Why Now" Trend Note ====== -->
  <rect x="100" y="640" width="1200" height="80" rx="6" fill="#F5F3EA" stroke="rgba(65,60,54,0.2)" stroke-width="1" stroke-dasharray="6,3" />
  <text x="130" y="665" class="annotation" fill="#C85A3A">WHY NOW</text>
  <text x="130" y="689" class="trend-note">"BIM and energy code compliance are causing design projects to become <tspan fill="#C85A3A" font-weight="600">'front-end loaded'</tspan> —</text>
  <text x="130" y="710" class="trend-note">more analytical work moves from Design Development into Schematic Design."</text>

  <!-- Annotation -->
  <text x="100" y="785" class="annotation">SCOPE DIAGRAM</text>
</svg>
