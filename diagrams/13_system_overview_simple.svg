<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .main-title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 22px; fill: #45d1b3; letter-spacing: 2px; }
      .subtitle { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 15px; font-weight: 400; fill: #8A8276; }
      .box-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 13px; font-weight: 700; fill: #45d1b3; letter-spacing: 2px; }
      .box-title { font-family: 'Kudryashev Display', Georgia, serif; font-size: 24px; fill: #E7E5D9; }
      .box-desc { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; font-weight: 400; fill: rgba(231,229,217,0.75); }
      .chip-text { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 11px; font-weight: 600; }
      .flow-label { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 14px; font-weight: 400; fill: #413C36; font-style: italic; }
      .annotation { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 9px; font-weight: 600; fill: rgba(138,130,118,0.7); letter-spacing: 3px; }
      .insight { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 18px; font-weight: 400; fill: #E7E5D9; }
      .insight-accent { font-family: 'Open Sauce', 'Open Sans', sans-serif; font-size: 18px; font-weight: 600; fill: #45d1b3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="700" fill="#F5F3EA" />

  <!-- Title -->
  <text x="700" y="55" text-anchor="middle" class="main-title">SYSTEM OVERVIEW</text>
  <text x="700" y="82" text-anchor="middle" class="subtitle">A division of labour between reasoning, interface, and geometry</text>

  <!-- ============================================ -->
  <!-- THREE MAIN BOXES -->
  <!-- ============================================ -->

  <!-- LEFT: REASONING (agents) -->
  <rect x="70" y="170" width="360" height="300" rx="10" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="250" y="210" text-anchor="middle" class="box-label">REASONING</text>
  <text x="250" y="250" text-anchor="middle" class="box-title">The Agents</text>
  <text x="250" y="278" text-anchor="middle" class="box-desc">Where disciplines argue</text>

  <!-- Agent chips -->
  <rect x="105" y="310" width="135" height="30" rx="15" fill="none" stroke="#5487B5" stroke-width="1.5" />
  <text x="172" y="330" text-anchor="middle" class="chip-text" fill="#5487B5">Structural</text>

  <rect x="260" y="310" width="135" height="30" rx="15" fill="none" stroke="#D9A84A" stroke-width="1.5" />
  <text x="327" y="330" text-anchor="middle" class="chip-text" fill="#D9A84A">MEP</text>

  <rect x="105" y="350" width="135" height="30" rx="15" fill="none" stroke="#C85A3A" stroke-width="1.5" />
  <text x="172" y="370" text-anchor="middle" class="chip-text" fill="#C85A3A">Cost</text>

  <rect x="260" y="350" width="135" height="30" rx="15" fill="none" stroke="#8A6BBF" stroke-width="1.5" />
  <text x="327" y="370" text-anchor="middle" class="chip-text" fill="#8A6BBF">Code</text>

  <rect x="183" y="390" width="135" height="30" rx="15" fill="none" stroke="#3A8A9E" stroke-width="1.5" />
  <text x="250" y="410" text-anchor="middle" class="chip-text" fill="#3A8A9E">Orchestrator</text>

  <!-- Small description below chips -->
  <text x="250" y="450" text-anchor="middle" class="box-desc" font-size="12">Language models trained to argue</text>
  <text x="250" y="467" text-anchor="middle" class="box-desc" font-size="12">from real engineering data</text>

  <!-- CENTER: INTERFACE (app + architect) -->
  <rect x="520" y="170" width="360" height="300" rx="10" fill="#413C36" stroke="#45d1b3" stroke-width="2" />
  <text x="700" y="210" text-anchor="middle" class="box-label">INTERFACE</text>
  <text x="700" y="250" text-anchor="middle" class="box-title">The App</text>
  <text x="700" y="278" text-anchor="middle" class="box-desc">Where the architect decides</text>

  <!-- Architect icon (simple person silhouette) -->
  <g transform="translate(700, 340)">
    <circle cx="0" cy="-28" r="16" fill="none" stroke="#45d1b3" stroke-width="2" />
    <path d="M -24,20 Q -24,-5 0,-5 Q 24,-5 24,20 Z" fill="none" stroke="#45d1b3" stroke-width="2" stroke-linejoin="round" />
  </g>
  <text x="700" y="400" text-anchor="middle" class="chip-text" fill="#45d1b3" font-size="13">ARCHITECT</text>
  <text x="700" y="420" text-anchor="middle" class="box-desc" font-size="12">(final authority)</text>

  <text x="700" y="452" text-anchor="middle" class="box-desc" font-size="12">Chat · Parameters · 3D model</text>

  <!-- RIGHT: GEOMETRY + ANALYSIS -->
  <rect x="970" y="170" width="360" height="300" rx="10" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="1150" y="210" text-anchor="middle" class="box-label">GEOMETRY &amp; ANALYSIS</text>
  <text x="1150" y="250" text-anchor="middle" class="box-title">Grasshopper</text>
  <text x="1150" y="278" text-anchor="middle" class="box-desc">Where reality is computed</text>

  <!-- Tool chips -->
  <rect x="1005" y="310" width="135" height="30" rx="15" fill="none" stroke="#E7E5D9" stroke-width="1" />
  <text x="1072" y="330" text-anchor="middle" class="chip-text" fill="#E7E5D9">Massing</text>

  <rect x="1160" y="310" width="135" height="30" rx="15" fill="none" stroke="#E7E5D9" stroke-width="1" />
  <text x="1227" y="330" text-anchor="middle" class="chip-text" fill="#E7E5D9">Karamba</text>

  <rect x="1005" y="350" width="135" height="30" rx="15" fill="none" stroke="#E7E5D9" stroke-width="1" />
  <text x="1072" y="370" text-anchor="middle" class="chip-text" fill="#E7E5D9">Windows</text>

  <rect x="1160" y="350" width="135" height="30" rx="15" fill="none" stroke="#E7E5D9" stroke-width="1" />
  <text x="1227" y="370" text-anchor="middle" class="chip-text" fill="#E7E5D9">Ladybug</text>

  <text x="1150" y="410" text-anchor="middle" class="box-desc" font-size="12">Structural forces, energy load,</text>
  <text x="1150" y="427" text-anchor="middle" class="box-desc" font-size="12">daylight, 3D geometry</text>

  <!-- ============================================ -->
  <!-- ARROWS BETWEEN BOXES -->
  <!-- ============================================ -->

  <!-- Reasoning ⇄ Interface -->
  <line x1="438" y1="305" x2="510" y2="305" stroke="#45d1b3" stroke-width="2" />
  <polygon points="512,299 525,305 512,311" fill="#45d1b3" />
  <text x="474" y="295" text-anchor="middle" class="flow-label">arguments</text>

  <line x1="510" y1="340" x2="438" y2="340" stroke="#8A8276" stroke-width="2" stroke-dasharray="5,3" />
  <polygon points="436,334 423,340 436,346" fill="#8A8276" />
  <text x="474" y="358" text-anchor="middle" class="flow-label">context</text>

  <!-- Interface → Geometry -->
  <line x1="888" y1="305" x2="960" y2="305" stroke="#45d1b3" stroke-width="2" />
  <polygon points="962,299 975,305 962,311" fill="#45d1b3" />
  <text x="924" y="295" text-anchor="middle" class="flow-label">decisions</text>

  <!-- Geometry → Interface -->
  <line x1="960" y1="340" x2="888" y2="340" stroke="#8A8276" stroke-width="2" stroke-dasharray="5,3" />
  <polygon points="886,334 873,340 886,346" fill="#8A8276" />
  <text x="924" y="358" text-anchor="middle" class="flow-label">3D + analysis</text>

  <!-- ============================================ -->
  <!-- KEY INSIGHT BAND -->
  <!-- ============================================ -->
  <rect x="100" y="530" width="1200" height="80" rx="8" fill="#413C36" stroke="rgba(65,60,54,0.2)" stroke-width="1" />
  <text x="700" y="564" text-anchor="middle" class="insight">The language models do the <tspan fill="#45d1b3">reasoning</tspan>.</text>
  <text x="700" y="588" text-anchor="middle" class="insight">Grasshopper does the <tspan fill="#45d1b3">engineering</tspan>. The architect does the <tspan fill="#45d1b3">deciding</tspan>.</text>

  <!-- Annotation -->
  <text x="100" y="660" class="annotation">SYSTEM OVERVIEW</text>
</svg>
