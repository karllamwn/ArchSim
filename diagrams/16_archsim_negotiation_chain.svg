<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap');
      .title-small { font-family: 'Open Sans', sans-serif; font-size: 11px; fill: #555555; font-style: italic; letter-spacing: 2px; font-weight: 600; }
      .phase-label { font-family: 'Open Sans', sans-serif; font-size: 13px; font-weight: 700; fill: #413C36; letter-spacing: 1.5px; }
      .subtask-label { font-family: 'Open Sans', sans-serif; font-size: 12px; font-weight: 600; fill: #413C36; }
      .row-label { font-family: 'Open Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #A09888; letter-spacing: 2.5px; font-style: italic; }
      .agent-label { font-family: 'Open Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #413C36; letter-spacing: 0.5px; }
      .agent-sublabel { font-family: 'Open Sans', sans-serif; font-size: 8.5px; fill: #8A8378; font-style: italic; }
      .chain-token { font-family: 'Open Sans', sans-serif; font-size: 11.5px; font-weight: 600; fill: #413C36; font-style: italic; }
      .caption { font-family: 'Open Sans', sans-serif; font-size: 11px; fill: #777777; font-style: italic; }
      .caption-strong { font-family: 'Open Sans', sans-serif; font-size: 11.5px; fill: #413C36; font-style: italic; font-weight: 700; }
      .loop-label { font-family: 'Open Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #2A9985; letter-spacing: 1.5px; font-style: italic; }
      .parallel-note { font-family: 'Open Sans', sans-serif; font-size: 9px; fill: #2A9985; font-style: italic; font-weight: 600; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#F5F3EA"/>

  <!-- Title -->
  <text x="80" y="50" class="title-small">ARCHSIM · STRUCTURE OF ONE NEGOTIATION ROUND</text>

  <!-- =========================================================== -->
  <!-- BAND 1: PHASES -->
  <!-- =========================================================== -->
  <rect x="80"   y="90" width="288" height="38" fill="#E8E3D5" stroke="#413C36" stroke-width="1"/>
  <text x="224" y="114" class="phase-label" text-anchor="middle">SETUP</text>

  <rect x="368"  y="90" width="864" height="38" fill="#45d1b3" fill-opacity="0.18" stroke="#413C36" stroke-width="1.5"/>
  <text x="800" y="114" class="phase-label" text-anchor="middle">NEGOTIATION ROUND</text>

  <rect x="1232" y="90" width="288" height="38" fill="#E8E3D5" stroke="#413C36" stroke-width="1"/>
  <text x="1376" y="114" class="phase-label" text-anchor="middle">CONVERGE</text>

  <!-- =========================================================== -->
  <!-- BAND 2: SUBTASKS -->
  <!-- =========================================================== -->
  <rect x="90"   y="148" width="268" height="38" fill="#FFFFFF" stroke="#413C36" stroke-width="0.8"/>
  <text x="224"  y="172" class="subtask-label" text-anchor="middle">Set Design Params</text>

  <rect x="378"  y="148" width="268" height="38" fill="#FFFFFF" stroke="#413C36" stroke-width="0.8"/>
  <text x="512"  y="172" class="subtask-label" text-anchor="middle">Deliberate (in parallel)</text>

  <rect x="666"  y="148" width="268" height="38" fill="#FFFFFF" stroke="#413C36" stroke-width="0.8"/>
  <text x="800"  y="172" class="subtask-label" text-anchor="middle">Synthesize Concerns</text>

  <rect x="954"  y="148" width="268" height="38" fill="#FFFFFF" stroke="#413C36" stroke-width="0.8"/>
  <text x="1088" y="172" class="subtask-label" text-anchor="middle">Simulate (Grasshopper)</text>

  <rect x="1242" y="148" width="268" height="38" fill="#FFFFFF" stroke="#413C36" stroke-width="0.8"/>
  <text x="1376" y="172" class="subtask-label" text-anchor="middle">Score → Architect Decides</text>

  <!-- Divider line under subtasks -->
  <line x1="80" y1="210" x2="1520" y2="210" stroke="#C8C0B0" stroke-width="0.8" stroke-dasharray="2,3"/>

  <!-- =========================================================== -->
  <!-- ROW LABEL: PROMPTS -->
  <!-- =========================================================== -->
  <text x="80" y="240" class="row-label">PROMPTS</text>

  <!-- INSTRUCTOR ROW  (center y = 280) -->
  <!-- Architect -->
  <g transform="translate(224,280)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#7A9471" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">ARCHITECT</text>
    <text x="0" y="49" text-anchor="middle" class="agent-sublabel">sets targets</text>
  </g>

  <!-- Planner (x4 — prompts / synth / request / score) -->
  <g transform="translate(512,280)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#45d1b3" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">PLANNER</text>
    <text x="0" y="49" text-anchor="middle" class="agent-sublabel">prompts agents</text>
  </g>

  <g transform="translate(800,280)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#45d1b3" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">PLANNER</text>
    <text x="0" y="49" text-anchor="middle" class="agent-sublabel">requests synthesis</text>
  </g>

  <g transform="translate(1088,280)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#45d1b3" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">PLANNER</text>
    <text x="0" y="49" text-anchor="middle" class="agent-sublabel">pushes to GH</text>
  </g>

  <g transform="translate(1376,280)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#45d1b3" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">PLANNER</text>
    <text x="0" y="49" text-anchor="middle" class="agent-sublabel">presents scores + recommendation</text>
  </g>

  <!-- =========================================================== -->
  <!-- CHAT CHAIN (y ~ 400) -->
  <!-- =========================================================== -->
  <text x="80" y="405" class="row-label">CHAT CHAIN</text>

  <!-- Background strip -->
  <rect x="80" y="420" width="1440" height="36" fill="#E8E3D5" fill-opacity="0.55" stroke="none"/>

  <!-- Tokens -->
  <text x="224"  y="443" class="chain-token" text-anchor="middle">{brief, params}</text>
  <text x="512"  y="443" class="chain-token" text-anchor="middle">{concerns ×4}</text>
  <text x="800"  y="443" class="chain-token" text-anchor="middle">{synthesis}</text>
  <text x="1088" y="443" class="chain-token" text-anchor="middle">{geometry}</text>
  <text x="1376" y="443" class="chain-token" text-anchor="middle">{scores, Δparams}</text>

  <!-- Arrows between tokens -->
  <line x1="293" y1="438" x2="436" y2="438" stroke="#413C36" stroke-width="1"/>
  <polygon points="436,434 436,442 446,438" fill="#413C36"/>

  <line x1="581" y1="438" x2="720" y2="438" stroke="#413C36" stroke-width="1"/>
  <polygon points="720,434 720,442 730,438" fill="#413C36"/>

  <line x1="860" y1="438" x2="1008" y2="438" stroke="#413C36" stroke-width="1"/>
  <polygon points="1008,434 1008,442 1018,438" fill="#413C36"/>

  <line x1="1148" y1="438" x2="1292" y2="438" stroke="#413C36" stroke-width="1"/>
  <polygon points="1292,434 1292,442 1302,438" fill="#413C36"/>

  <!-- =========================================================== -->
  <!-- ROW LABEL: RESPONDS -->
  <!-- =========================================================== -->
  <text x="80" y="490" class="row-label">RESPONDS</text>

  <!-- ASSISTANT ROW (center y = 530) -->
  <!-- Col 1: Architect (picks values) -->
  <g transform="translate(224,530)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#7A9471" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">ARCHITECT</text>
    <text x="0" y="49" text-anchor="middle" class="agent-sublabel">picks values</text>
  </g>

  <!-- Col 2: FOUR CONSULTANTS IN PARALLEL — the key insight -->
  <!-- Highlight bracket (top + bottom) -->
  <path d="M 402 493 Q 402 487, 408 487 L 616 487 Q 622 487, 622 493"
        fill="none" stroke="#45d1b3" stroke-width="1.5"/>
  <path d="M 402 572 Q 402 578, 408 578 L 616 578 Q 622 578, 622 572"
        fill="none" stroke="#45d1b3" stroke-width="1.5"/>

  <!-- Structural -->
  <g transform="translate(432,530)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#5880A6" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">STRUCT</text>
  </g>
  <!-- MEP -->
  <g transform="translate(486,530)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#BE8E46" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">MEP</text>
  </g>
  <!-- Cost -->
  <g transform="translate(540,530)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#B05540" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">COST</text>
  </g>
  <!-- Code -->
  <g transform="translate(594,530)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#7E5FA0" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">CODE</text>
  </g>
  <!-- "in parallel" note under the 4 agents -->
  <text x="512" y="595" class="parallel-note" text-anchor="middle">◉ 4 SPECIALISTS DELIBERATE IN PARALLEL</text>

  <!-- Col 3: Planner synthesizes -->
  <g transform="translate(800,530)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#45d1b3" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">PLANNER</text>
    <text x="0" y="49" text-anchor="middle" class="agent-sublabel">writes synthesis</text>
  </g>

  <!-- Col 4: Grasshopper (Karamba + Ladybug) -->
  <g transform="translate(1062,530)">
    <rect x="-18" y="-24" width="36" height="40" rx="4" fill="#E8E3D5" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="-9" text-anchor="middle" font-family="'Open Sans',sans-serif" font-size="8" font-weight="700" fill="#413C36">GH</text>
    <text x="0" y="7" text-anchor="middle" font-family="'Open Sans',sans-serif" font-size="7.5" fill="#413C36">KRM</text>
    <text x="0" y="36" text-anchor="middle" class="agent-label">KARAMBA3D</text>
  </g>
  <g transform="translate(1114,530)">
    <rect x="-18" y="-24" width="36" height="40" rx="4" fill="#E8E3D5" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="-9" text-anchor="middle" font-family="'Open Sans',sans-serif" font-size="8" font-weight="700" fill="#413C36">GH</text>
    <text x="0" y="7" text-anchor="middle" font-family="'Open Sans',sans-serif" font-size="7.5" fill="#413C36">LBG</text>
    <text x="0" y="36" text-anchor="middle" class="agent-label">LADYBUG</text>
  </g>
  <text x="1088" y="595" class="parallel-note" text-anchor="middle">◉ GEOMETRIC GROUND TRUTH</text>

  <!-- Col 5: ARCHITECT decides — the only human decision point -->
  <g transform="translate(1376,530)">
    <circle cx="0" cy="-20" r="11" fill="#E8C8A8" stroke="#413C36" stroke-width="1.5"/>
    <circle cx="-3.5" cy="-21" r="1.2" fill="#413C36"/>
    <circle cx="3.5" cy="-21" r="1.2" fill="#413C36"/>
    <rect x="-14" y="-8" width="28" height="28" rx="2" fill="#7A9471" stroke="#413C36" stroke-width="1.5"/>
    <text x="0" y="36" text-anchor="middle" class="agent-label">ARCHITECT</text>
    <text x="0" y="49" text-anchor="middle" class="agent-sublabel">decides: converge or iterate</text>
  </g>
  <!-- Highlight the architect's decision authority -->
  <rect x="1352" y="498" width="48" height="58" rx="4" fill="none" stroke="#C8361F" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="1376" y="595" class="parallel-note" text-anchor="middle" fill="#C8361F">◉ SOLE HUMAN DECISION POINT</text>

  <!-- Divider before loop -->
  <line x1="80" y1="625" x2="1520" y2="625" stroke="#C8C0B0" stroke-width="0.8" stroke-dasharray="2,3"/>

  <!-- =========================================================== -->
  <!-- LOOP-BACK ARROW -->
  <!-- =========================================================== -->
  <path d="M 1376 640 Q 1376 705, 1320 710 L 568 710 Q 512 710, 512 640"
        fill="none" stroke="#45d1b3" stroke-width="1.8" stroke-dasharray="7,4"/>
  <polygon points="508,644 516,644 512,632" fill="#45d1b3"/>
  <text x="944" y="735" class="loop-label" text-anchor="middle">↻ IF ARCHITECT REJECTS CONVERGENCE — NEW ROUND BEGINS</text>

  <!-- =========================================================== -->
  <!-- CAPTION -->
  <!-- =========================================================== -->
  <text x="80" y="800" class="caption-strong">Figure: Structure of one negotiation round in ArchSim.</text>
  <text x="80" y="820" class="caption">Each round cycles through five subtasks. The Architect sets targets and picks design-parameter values; the Planner prompts four specialist agents (Structural, MEP, Cost, Code)</text>
  <text x="80" y="838" class="caption">who deliberate <tspan font-weight="700" fill="#413C36">in parallel</tspan>; the Planner synthesizes their concerns into a parameter update; Grasshopper (Karamba3D + Ladybug) computes geometric and performative ground truth;</text>
  <text x="80" y="856" class="caption">the Planner scores and <tspan font-weight="700" fill="#413C36">recommends</tspan> convergence — but the <tspan font-weight="700" fill="#C8361F">Architect decides</tspan>. Agents hold analytical authority; the Architect holds design authority. Convergence is never automatic.</text>
</svg>
