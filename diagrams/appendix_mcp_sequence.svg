<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap');
      .main-title { font-family: 'Press Start 2P', monospace; font-size: 18px; fill: #45d1b3; letter-spacing: 2px; }
      .actor-label { font-family: 'Press Start 2P', monospace; font-size: 9px; fill: #ecf7f3; letter-spacing: 1px; }
      .actor-sub { font-family: 'VT323', monospace; font-size: 18px; fill: rgba(152,181,172,0.85); }
      .msg-text { font-family: 'VT323', monospace; font-size: 19px; fill: #ecf7f3; }
      .msg-text-sm { font-family: 'VT323', monospace; font-size: 17px; fill: rgba(152,181,172,0.7); }
      .branch-label { font-family: 'Press Start 2P', monospace; font-size: 9px; fill: #45d1b3; }
      .branch-reject { font-family: 'Press Start 2P', monospace; font-size: 9px; fill: #ff7f50; }
      .annotation { font-family: 'Press Start 2P', monospace; font-size: 8px; fill: rgba(152,181,172,0.5); letter-spacing: 3px; }
      .self-box-text { font-family: 'VT323', monospace; font-size: 17px; fill: rgba(152,181,172,0.85); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="960" fill="#0d1716" />

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" class="main-title">MCP INTERACTION SEQUENCE</text>
  <text x="700" y="62" text-anchor="middle" class="annotation">TOOL INVOCATION LIFECYCLE</text>

  <!-- Actor columns: x = 180, 480, 780, 1100 -->
  <!-- Top actor boxes -->
  <rect x="120" y="85" width="120" height="45" rx="4" fill="#163532" stroke="rgba(171,218,201,0.22)" stroke-width="1" />
  <text x="180" y="112" text-anchor="middle" class="actor-label">USER</text>

  <rect x="410" y="85" width="140" height="45" rx="4" fill="#163532" stroke="rgba(171,218,201,0.22)" stroke-width="1" />
  <text x="480" y="105" text-anchor="middle" class="actor-label">LLM</text>
  <text x="480" y="122" text-anchor="middle" class="actor-sub">(Host)</text>

  <rect x="710" y="85" width="140" height="45" rx="4" fill="#163532" stroke="rgba(171,218,201,0.22)" stroke-width="1" />
  <text x="780" y="105" text-anchor="middle" class="actor-label">MCP</text>
  <text x="780" y="122" text-anchor="middle" class="actor-sub">Client</text>

  <rect x="1020" y="85" width="160" height="45" rx="4" fill="#163532" stroke="#45d1b3" stroke-width="1.5" />
  <text x="1100" y="103" text-anchor="middle" class="actor-label">MCP SERVER</text>
  <text x="1100" y="122" text-anchor="middle" class="actor-sub">(Grasshopper)</text>

  <!-- Lifelines -->
  <line x1="180" y1="130" x2="180" y2="830" stroke="rgba(171,218,201,0.15)" stroke-width="1" stroke-dasharray="6,4" />
  <line x1="480" y1="130" x2="480" y2="830" stroke="rgba(171,218,201,0.15)" stroke-width="1" stroke-dasharray="6,4" />
  <line x1="780" y1="130" x2="780" y2="830" stroke="rgba(171,218,201,0.15)" stroke-width="1" stroke-dasharray="6,4" />
  <line x1="1100" y1="130" x2="1100" y2="830" stroke="rgba(171,218,201,0.15)" stroke-width="1" stroke-dasharray="6,4" />

  <!-- MSG 1: User → LLM: Submit design request -->
  <line x1="180" y1="170" x2="463" y2="170" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="465,164 478,170 465,176" fill="#45d1b3" />
  <text x="324" y="162" text-anchor="middle" class="msg-text">Submit a design request</text>

  <!-- MSG 2: LLM → MCP Client: Reasoning -->
  <line x1="480" y1="210" x2="763" y2="210" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="765,204 778,210 765,216" fill="#45d1b3" />
  <text x="624" y="198" text-anchor="middle" class="msg-text">Reasoning and initiating</text>
  <text x="624" y="216" text-anchor="middle" class="msg-text-sm">a tool invocation request</text>

  <!-- APPROVAL BOX -->
  <rect x="145" y="248" width="985" height="275" rx="0" fill="none" stroke="rgba(171,218,201,0.2)" stroke-width="1" stroke-dasharray="8,4" />
  <text x="165" y="270" class="branch-label">[Approved]</text>

  <!-- MSG 3: MCP Client → User: Request approval (dashed) -->
  <line x1="780" y1="295" x2="197" y2="295" stroke="rgba(152,181,172,0.5)" stroke-width="1.5" stroke-dasharray="6,3" />
  <polygon points="195,289 182,295 195,301" fill="rgba(152,181,172,0.7)" />
  <text x="486" y="287" text-anchor="middle" class="msg-text">Request execution approval</text>

  <!-- MSG 4: User → LLM: Approve -->
  <line x1="180" y1="335" x2="463" y2="335" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="465,329 478,335 465,341" fill="#45d1b3" />
  <text x="324" y="327" text-anchor="middle" class="msg-text">Approve the operation</text>

  <!-- MSG 5: LLM → MCP Server: Send commands -->
  <line x1="480" y1="375" x2="1083" y2="375" stroke="#45d1b3" stroke-width="1.5" />
  <polygon points="1085,369 1098,375 1085,381" fill="#45d1b3" />
  <text x="784" y="367" text-anchor="middle" class="msg-text">Send formal MCP commands</text>

  <!-- MSG 6: MCP Server self: Parse + execute -->
  <rect x="1085" y="395" width="195" height="48" rx="4" fill="#163532" stroke="rgba(171,218,201,0.22)" stroke-width="1" />
  <text x="1182" y="415" text-anchor="middle" class="self-box-text">Parse commands and</text>
  <text x="1182" y="433" text-anchor="middle" class="self-box-text">invoke GH runtime</text>

  <!-- MSG 7: MCP Server → MCP Client: Return results (dashed) -->
  <line x1="1100" y1="462" x2="797" y2="462" stroke="rgba(152,181,172,0.5)" stroke-width="1.5" stroke-dasharray="6,3" />
  <polygon points="795,456 782,462 795,468" fill="rgba(152,181,172,0.7)" />
  <text x="946" y="454" text-anchor="middle" class="msg-text">Return execution results</text>

  <!-- MSG 8: MCP Client → LLM: Tool output (dashed) -->
  <line x1="780" y1="500" x2="497" y2="500" stroke="rgba(152,181,172,0.5)" stroke-width="1.5" stroke-dasharray="6,3" />
  <polygon points="495,494 482,500 495,506" fill="rgba(152,181,172,0.7)" />
  <text x="636" y="492" text-anchor="middle" class="msg-text">Send tool output results back</text>

  <!-- REJECTED label -->
  <text x="165" y="555" class="branch-reject">[Rejected]</text>

  <!-- MSG 9: rejection (dashed) -->
  <line x1="780" y1="575" x2="497" y2="575" stroke="#ff7f50" stroke-width="1.5" stroke-dasharray="6,3" />
  <polygon points="495,569 482,575 495,581" fill="#ff7f50" />
  <text x="636" y="567" text-anchor="middle" class="msg-text">Tool invocation rejection message</text>

  <!-- MSG 10: LLM self: Integrate -->
  <rect x="370" y="615" width="220" height="45" rx="4" fill="#163532" stroke="rgba(171,218,201,0.22)" stroke-width="1" />
  <text x="480" y="635" text-anchor="middle" class="self-box-text">Integrate and generate</text>
  <text x="480" y="653" text-anchor="middle" class="self-box-text">the final response</text>

  <!-- MSG 11: LLM → User: Final response (dashed) -->
  <line x1="480" y1="680" x2="197" y2="680" stroke="rgba(152,181,172,0.5)" stroke-width="1.5" stroke-dasharray="6,3" />
  <polygon points="195,674 182,680 195,686" fill="rgba(152,181,172,0.7)" />

  <!-- Bottom actor boxes -->
  <rect x="120" y="790" width="120" height="45" rx="4" fill="#163532" stroke="rgba(171,218,201,0.22)" stroke-width="1" />
  <text x="180" y="817" text-anchor="middle" class="actor-label">USER</text>

  <rect x="410" y="790" width="140" height="45" rx="4" fill="#163532" stroke="rgba(171,218,201,0.22)" stroke-width="1" />
  <text x="480" y="810" text-anchor="middle" class="actor-label">LLM</text>
  <text x="480" y="827" text-anchor="middle" class="actor-sub">(Host)</text>

  <rect x="710" y="790" width="140" height="45" rx="4" fill="#163532" stroke="rgba(171,218,201,0.22)" stroke-width="1" />
  <text x="780" y="810" text-anchor="middle" class="actor-label">MCP</text>
  <text x="780" y="827" text-anchor="middle" class="actor-sub">Client</text>

  <rect x="1020" y="790" width="160" height="45" rx="4" fill="#163532" stroke="#45d1b3" stroke-width="1.5" />
  <text x="1100" y="808" text-anchor="middle" class="actor-label">MCP SERVER</text>
  <text x="1100" y="827" text-anchor="middle" class="actor-sub">(Grasshopper)</text>

  <!-- Annotation -->
  <text x="100" y="920" class="annotation">SEQUENCE</text>
</svg>
